name: Codex exact-head review request

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Exact open pull request number to reconcile from protected main.
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: codex-review-receipt-${{ inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  request-and-verify-review:
    if: >-
      (github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.pr_number > 0)
    permissions:
      checks: write
      contents: read
      pull-requests: read
    uses: ./.github/workflows/codex-review-receipt.yml
    with:
      pr_number: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || 0 }}
      base_branch: main
