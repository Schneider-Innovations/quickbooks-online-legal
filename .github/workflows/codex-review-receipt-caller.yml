name: Codex exact-head review request

on:
  pull_request_target:
    types:
      - labeled
      - unlabeled
      - reopened
      - closed
      - synchronize
      - converted_to_draft
  workflow_dispatch:
    inputs:
      pr_number:
        description: Exact open pull request number to reconcile from protected main.
        required: true
        type: number

# This caller is resolved from the protected base branch. It never checks out
# or executes pull-request-controlled code. The reusable workflow snapshots the
# same-repository PR for the isolated local Codex CLI service; it receives no
# subscription credential or GitHub write token.
permissions:
  contents: read

concurrency:
  group: codex-review-receipt-${{ inputs.pr_number || github.event.pull_request.number }}
  # Only a new head supersedes an active review. Same-head label, draft, and
  # reconciliation events must not cancel a job after it created receipt Checks.
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' && github.event.action == 'synchronize' }}

jobs:
  # This is a scheduling contract, not an approval.  It is deliberately a
  # separate Check name from ai-review/receipt: only the latter may satisfy
  # the protected exact-head review rule.
  publish-review-request:
    if: >-
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.draft == false &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'ready-for-final-review' &&
       github.actor == (vars.AI_REVIEW_REQUESTER_LOGIN || 'mercury1231')) ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       inputs.pr_number > 0 &&
       github.actor == (vars.AI_REVIEW_REQUESTER_LOGIN || 'mercury1231'))
    runs-on: ${{ fromJSON(vars.CI_GENERAL_RUNS_ON || vars.CI_RUNS_ON || '["self-hosted","Linux","X64","linux-general"]') }}
    permissions:
      checks: write
      contents: read
      pull-requests: read
    steps:
      - name: Publish non-gating review scheduling contract
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || 0 }}
          REQUIRED_LABEL: ready-for-final-review
          REQUESTER_LOGIN: ${{ vars.AI_REVIEW_REQUESTER_LOGIN || 'mercury1231' }}
          REVIEW_WORKFLOW_REF: d32707342a9ff275e0e17295716aee7fceb819c5 # pragma: allowlist secret
        with:
          script: |
            const requestedPrNumber = Number(process.env.PR_NUMBER);
            const pr = context.payload.pull_request || (
              requestedPrNumber > 0
                ? (await github.rest.pulls.get({ ...context.repo, pull_number: requestedPrNumber })).data
                : null
            );
            if (!pr) {
              core.setFailed('AI_REVIEW_REQUEST_PR_CONTEXT_REQUIRED');
              return;
            }
            const { owner, repo } = context.repo;
            const label = process.env.REQUIRED_LABEL;
            const requester = process.env.REQUESTER_LOGIN.toLowerCase();
            if (
              pr.state !== 'open' ||
              pr.draft ||
              pr.base.ref !== 'main' ||
              pr.head.repo?.full_name !== `${owner}/${repo}` ||
              !(pr.labels || []).some((candidate) => candidate.name === label) ||
              context.actor.toLowerCase() !== requester
            ) {
              core.setFailed('AI_REVIEW_REQUEST_SCOPE_FORBIDDEN');
              return;
            }
            const headSha = pr.head.sha.toLowerCase();
            const baseSha = pr.base.sha.toLowerCase();
            const now = new Date();
            const request = {
              schema: 'ai-review-request/v1',
              state: 'waiting_for_runner',
              repository: `${owner}/${repo}`,
              pr_number: pr.number,
              base_sha: baseSha,
              head_sha: headSha,
              request_generation: String(context.runId),
              idempotency_key: `${owner}/${repo}:${pr.number}:${baseSha}:${headSha}:${process.env.REVIEW_WORKFLOW_REF}:${context.runId}`,
              accepted_at: now.toISOString(),
              next_check_after: new Date(now.getTime() + 5 * 60 * 1000).toISOString(),
              escalate_after: new Date(now.getTime() + 10 * 60 * 1000).toISOString(),
              expected_completion_by: null,
              estimate_confidence: 'unknown',
              terminal: false,
            };
            await github.rest.checks.create({
              owner,
              repo,
              name: 'ai-review/request',
              head_sha: headSha,
              status: 'in_progress',
              external_id: `ai-review-request:${pr.number}:${headSha}:${context.runId}`,
              output: {
                title: 'AI review waiting for Runner capacity',
                summary: 'The review request was accepted. Follow up after the published next_check_after time; do not dispatch a duplicate request.',
                text: `\`\`\`json\n${JSON.stringify(request)}\n\`\`\``,
              },
            });

  invalidate-review:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (
          github.event.action == 'closed' ||
          github.event.action == 'reopened' ||
        github.event.action == 'synchronize' ||
        github.event.action == 'converted_to_draft' ||
        (github.event.action == 'unlabeled' && github.event.label.name == 'ready-for-final-review') ||
        (github.event.action == 'labeled' &&
         github.event.label.name == 'ready-for-final-review' &&
         !(github.event.pull_request.draft == false &&
           github.actor == (vars.AI_REVIEW_REQUESTER_LOGIN || 'mercury1231')))
      )
    # Invalidating a stale receipt is trusted-base housekeeping. Keep it on
    # the ordinary self-hosted pool; a missing repository variable must never
    # silently fall back to billed GitHub-hosted capacity.
    runs-on: ${{ fromJSON(vars.CI_GENERAL_RUNS_ON || vars.CI_RUNS_ON || '["self-hosted","Linux","X64","linux-general"]') }}
    permissions:
      checks: write
      contents: read
      issues: read
      pull-requests: read
    steps:
      # Organization policy keeps GITHUB_TOKEN read-only. This narrow token is
      # repository-scoped and used only to remove a stale readiness label; no
      # pull-request code is checked out or executed by this base-owned job.
      - name: Remove stale final-head review label
        id: remove-stale-label
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          EXPECTED_TOKEN_OWNER: ${{ vars.AI_REVIEW_REQUESTER_LOGIN || 'mercury1231' }}
        with:
          github-token: ${{ secrets.CODEX_REVIEW_TRIGGER_TOKEN }}
          script: |
            const label = 'ready-for-final-review';
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const expectedOwner = process.env.EXPECTED_TOKEN_OWNER.toLowerCase();
            const authenticated = await github.rest.users.getAuthenticated();
            if (authenticated.data.login?.toLowerCase() !== expectedOwner) {
              core.setFailed('AI_REVIEW_TRIGGER_IDENTITY_MISMATCH');
              return;
            }
            let labelRemoved = true;
            if (pr.labels.some((candidate) => candidate.name === label)) {
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: pr.number,
                  name: label,
                });
              } catch (error) {
                // Some organizations intentionally restrict the
                // pull_request_target token from mutating issue labels. The
                // receipt gate below remains fail-closed, so a stale PASS can
                // never authorize this new head; an authorized user must
                // explicitly reapply the label to request a fresh review.
                labelRemoved = false;
                core.warning(`AI_CLI_REVIEW_LABEL_INVALIDATION_DENIED:${error.status || 'unknown'}`);
              }
            }
            core.setOutput('label_removed', labelRemoved ? 'true' : 'false');

      # End the non-gating scheduling record independently from the merge gate.
      - name: End invalidated review scheduling contract
        if: always()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const state = context.payload.action === 'synchronize'
              ? 'superseded'
              : 'not_requested';
            const reason = context.payload.action === 'synchronize'
              ? 'The pull request head changed; apply ready-for-final-review to request review of the new head.'
              : 'Final-head review is not currently requested for this pull request.';
            const refs = new Set([pr.head.sha, context.payload.before].filter((sha) =>
              /^[0-9a-f]{40}$/i.test(sha || ''),
            ));
            for (const sha of refs) {
              const existingChecks = await github.paginate(
                github.rest.checks.listForRef,
                { owner, repo, ref: sha, per_page: 100, filter: 'all' },
              );
              const existing = existingChecks.filter((check) =>
                check.name === 'ai-review/request' &&
                  check.status !== 'completed' &&
                  check.external_id?.startsWith(`ai-review-request:${pr.number}:`),
              );
              const request = {
                schema: 'ai-review-request/v1',
                state,
                repository: `${owner}/${repo}`,
                pr_number: pr.number,
                base_sha: pr.base.sha.toLowerCase(),
                head_sha: sha.toLowerCase(),
                request_generation: String(context.runId),
                terminal: true,
                reason,
                transitioned_at: new Date().toISOString(),
              };
              const parameters = {
                owner,
                repo,
                status: 'completed',
                conclusion: 'neutral',
                output: {
                  title: state === 'superseded'
                    ? 'AI review request superseded'
                    : 'AI review not requested',
                  summary: reason,
                  text: `\`\`\`json\n${JSON.stringify(request)}\n\`\`\``,
                },
              };
              if (existing.length > 0) {
                for (const check of existing) {
                  await github.rest.checks.update({
                    ...parameters,
                    check_run_id: check.id,
                  });
                }
              } else if (sha.toLowerCase() === pr.head.sha.toLowerCase()) {
                await github.rest.checks.create({
                  ...parameters,
                  name: 'ai-review/request',
                  head_sha: sha,
                  external_id: `ai-review-request:${pr.number}:${sha}:${context.runId}`,
                });
              }
                }

      # A previously successful receipt on the same SHA must stop authorizing
      # merge when the PR closes, reopens, becomes draft, or loses its final
      # review label. Keep the old fail-closed invalidation as a separate Check
      # operation; Request terminalization alone cannot revoke a Receipt PASS.
      - name: Invalidate stale final-head review receipt
        if: always()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          LABEL_REMOVED: ${{ steps.remove-stale-label.outputs.label_removed }}
        with:
          script: |
            const label = 'ready-for-final-review';
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const upsertInvalidation = async (sha, externalIdPrefix) => {
              const existingChecks = await github.paginate(
                github.rest.checks.listForRef,
                { owner, repo, ref: sha, per_page: 100, filter: 'all' },
              );
              const existing = existingChecks.find((check) =>
                check.name === 'ai-review/receipt' &&
                  check.status !== 'completed' &&
                  check.external_id?.startsWith(`${externalIdPrefix}:`),
              );
              const parameters = {
                owner,
                repo,
                status: 'completed',
                conclusion: 'failure',
                completed_at: new Date().toISOString(),
                output: {
                  title: 'Final-head AI review invalidated',
                  summary: process.env.LABEL_REMOVED === 'true'
                    ? `Apply ${label} to the stable, non-draft PR when it is ready for final review.`
                    : `The workflow could not remove ${label}; remove and reapply it to request final review.`,
                },
              };
              if (existing) {
                await github.rest.checks.update({
                  ...parameters,
                  check_run_id: existing.id,
                });
              } else {
                await github.rest.checks.create({
                  ...parameters,
                  name: 'ai-review/receipt',
                  head_sha: sha,
                  external_id: `${externalIdPrefix}:${context.runId}`,
                });
              }
            };
            await upsertInvalidation(
              pr.head.sha,
              `ai-review-invalidated:${pr.number}:${pr.head.sha}`,
            );
            try {
              const mergeSha = (await github.rest.git.getRef({
                owner,
                repo,
                ref: `pull/${pr.number}/merge`,
              })).data.object?.sha;
              if (!/^[0-9a-f]{40}$/i.test(mergeSha || '')) {
                throw new Error('merge ref did not resolve to a full SHA');
              }
              await upsertInvalidation(
                mergeSha,
                `ai-review-invalidated:merge:${pr.number}:${pr.head.sha}:${mergeSha}`,
              );
            } catch (error) {
              core.setFailed(`AI_REVIEW_MERGE_INVALIDATION_FAILED:${error.status || error.message || 'unknown'}`);
            }

  request-and-verify-review:
    needs: publish-review-request
    if: >-
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.draft == false &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'ready-for-final-review' &&
       github.actor == (vars.AI_REVIEW_REQUESTER_LOGIN || 'mercury1231')) ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       inputs.pr_number > 0 &&
       github.actor == (vars.AI_REVIEW_REQUESTER_LOGIN || 'mercury1231'))
    permissions:
      checks: write
      contents: read
      issues: read
      pull-requests: read
    # Public legal repositories retain a base-owned local reusable workflow.
    # Its code is reviewed in the same PR as this caller and remains subject to
    # the restricted runner-group workflow allowlist for this exact path.
    uses: ./.github/workflows/codex-cli-review-receipt.yml
    with:
      # workflow_dispatch inputs arrive as strings. Convert explicitly so the
      # reusable workflow's number input receives a JSON number, not "19".
      pr_number: ${{ github.event_name == 'workflow_dispatch' && fromJSON(inputs.pr_number) || 0 }}
      base_branch: main
      # Keep the reusable workflow's requester check exactly aligned with the
      # caller's protected-base authorization check. The value is a repository
      # variable, not a credential, and is passed only as an immutable input.
      requester_login: ${{ vars.AI_REVIEW_REQUESTER_LOGIN || 'mercury1231' }}
    secrets:
      codex_trigger_token: ${{ secrets.CODEX_REVIEW_TRIGGER_TOKEN }}
