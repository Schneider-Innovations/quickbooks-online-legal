name: Codex exact-head review request

on:
  pull_request_target:
    types:
      - labeled
      - unlabeled
      - reopened
      - closed
      - synchronize
      - converted_to_draft
  workflow_dispatch:
    inputs:
      pr_number:
        description: Exact open pull request number to reconcile from protected main.
        required: true
        type: number

# This caller is resolved from the protected base branch. It never checks out
# or executes pull-request-controlled code. The reusable workflow snapshots the
# same-repository PR for the isolated local Codex CLI service; it receives no
# subscription credential or GitHub write token.
permissions:
  contents: read

concurrency:
  group: codex-review-receipt-${{ inputs.pr_number || github.event.pull_request.number }}-${{ github.event.pull_request.head.sha || github.run_id }}-${{ github.run_attempt }}
  # Only a new head supersedes an active review. Same-head label, draft, and
  # reconciliation events must not cancel a job after it created receipt Checks.
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' && github.event.action == 'synchronize' }}

jobs:
  admit-review-request:
    runs-on: ${{ fromJSON(vars.CI_GENERAL_RUNS_ON || vars.CI_RUNS_ON || (github.event.repository.private == false && '["ubuntu-latest"]' || '["self-hosted","Linux","X64","linux-general"]')) }}
    timeout-minutes: 5
    concurrency:
      group: review-request-admission-${{ github.repository }}-${{ github.event.pull_request.number || github.event.client_payload.pr_number || github.event.inputs.pr_number }}
      cancel-in-progress: false
    permissions:
      checks: write
      actions: read
      contents: read
      pull-requests: read
    outputs:
      admitted: ${{ steps.admission.outputs.admitted }}
    steps:
      - env:
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.client_payload.pr_number || github.event.inputs.pr_number }}
          REVIEW_WORKFLOW_REF: d51188eb6386c9c1bbb0551a03c5907b1745c905 # pragma: allowlist secret
        id: admission
        name: Deduplicate active exact-head review requests
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          retries: 0
          script: |
            // Runs only in the protected caller's short, per-PR serialized admission job.
            // A neutral ledger entry is scheduling evidence; it is never a review verdict.
            core.setOutput('admitted', 'false');
            const number = Number(process.env.PR_NUMBER);
            if (!Number.isSafeInteger(number) || number <= 0) throw new Error('ADMISSION_PR_REQUIRED');
            const pr = (await github.rest.pulls.get({ ...context.repo, pull_number: number })).data;
            if (pr.state !== 'open' || pr.draft || pr.base.ref !== 'main' ||
                pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                !pr.labels.some(label => label.name === 'ready-for-final-review')) {
              core.notice('ADMISSION_PR_NOT_READY');
              return;
            }
            if (context.payload.pull_request && context.payload.pull_request.head.sha !== pr.head.sha) {
              core.notice('ADMISSION_STALE_EVENT');
              return;
            }
            const base = (await github.rest.repos.getBranch({ ...context.repo, branch: 'main' })).data.commit.sha;
            const identity = { repository: `${context.repo.owner}/${context.repo.repo}`, pr: number,
              head: pr.head.sha, base, workflow_ref: process.env.REVIEW_WORKFLOW_REF };
            const runId = Number(context.runId);
            const attempt = Number(process.env.GITHUB_RUN_ATTEMPT);
            const prefix = `review-admission/1:${identity.repository}:${number}:`;
            const listed = (await github.rest.checks.listForRef({ ...context.repo, ref: pr.head.sha,
              check_name: 'ai-review/admission', filter: 'all', per_page: 100 })).data;
            // Compact completed owners into a separate audit Check name. Bound each
            // pass to the 100 fetched records; never admit from truncated active evidence.
            // A legacy backlog makes durable progress instead of permanently exhausting
            // a lifetime retry quota. No review verdict or receipt Check is modified.
            let archived = 0;
            for (const check of listed.check_runs) {
              if (check.app?.id !== 15368 || check.status !== 'completed' || check.conclusion !== 'neutral' ||
                  !check.external_id?.startsWith(prefix)) continue;
              let record;
              try { record = JSON.parse(check.output?.summary || ''); } catch { continue; }
              if (record.schema_version !== 'review-admission/1' ||
                  record.repository !== identity.repository || record.pr !== number || record.head !== identity.head ||
                  !Number.isSafeInteger(record.run_id) || !Number.isSafeInteger(record.run_attempt) ||
                  check.external_id !== `${prefix}${record.run_id}:${record.run_attempt}`) continue;
              const sameIdentity = Object.entries(identity).every(([key, value]) => record[key] === value);
              const run = (await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: record.run_id })).data;
              if (run.path !== '.github/workflows/codex-review-receipt-caller.yml' ||
                  !['pull_request_target', 'repository_dispatch', 'workflow_dispatch'].includes(run.event)) continue;
              if (run.status === 'completed') {
                await github.rest.checks.update({ ...context.repo, check_run_id: check.id, name: 'ai-review/admission-history' });
                archived += 1;
                continue;
              }
              if (!sameIdentity || run.run_attempt !== record.run_attempt) continue;
              if (record.run_id === runId && record.run_attempt === attempt) {
                core.setOutput('admitted', 'true');
                return;
              }
              if (run.status !== 'completed') {
                core.notice(`ADMISSION_DUPLICATE_ACTIVE_RUN:${record.run_id}`);
                return;
              }
            }
            if (listed.total_count > 100) {
              core.notice(`ADMISSION_HISTORY_COMPACTED:${archived}`);
              throw new Error('ADMISSION_HISTORY_COMPACTED_RETRY');
            }
            await github.rest.checks.create({ ...context.repo, name: 'ai-review/admission',
              head_sha: pr.head.sha, status: 'completed', conclusion: 'neutral',
              external_id: `${prefix}${runId}:${attempt}`,
              output: { title: 'Review request admitted', summary: JSON.stringify({
                schema_version: 'review-admission/1', ...identity, run_id: runId, run_attempt: attempt }) } });
            core.setOutput('admitted', 'true');
    if: (github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false && github.event.action == 'labeled' && github.event.label.name == 'ready-for-final-review' && github.actor == (vars.AI_REVIEW_REQUESTER_LOGIN || 'mercury1231')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.pr_number > 0 && github.actor == (vars.AI_REVIEW_REQUESTER_LOGIN || 'mercury1231'))

  invalidate-review:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        github.event.action == 'closed' ||
        github.event.action == 'reopened' ||
        github.event.action == 'synchronize' ||
        github.event.action == 'converted_to_draft' ||
        (github.event.action == 'unlabeled' && github.event.label.name == 'ready-for-final-review') ||
        (github.event.action == 'labeled' &&
         github.event.label.name == 'ready-for-final-review' &&
         !(github.event.pull_request.draft == false &&
           github.actor == (vars.AI_REVIEW_REQUESTER_LOGIN || 'mercury1231')))
      )
    runs-on: ${{ fromJSON(vars.CI_GENERAL_RUNS_ON || vars.CI_RUNS_ON || '["ubuntu-latest"]') }}
    permissions:
      checks: write
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Ignore obsolete invalidation events
        id: invalidation-current
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          retries: 0
          script: |
            // A delayed close/reopen/synchronize event must not erase a later request.
            // Unknown API state preserves the original fail-closed invalidation behavior.
            core.setOutput('current', 'true');
            const event = context.payload.pull_request;
            const live = (await github.rest.pulls.get({ ...context.repo, pull_number: event.number })).data;
            const action = context.payload.action;
            const obsolete = live.head.sha !== event.head.sha ||
              (action === 'closed' && live.state !== 'closed') ||
              (action === 'converted_to_draft' && !live.draft);
            if (obsolete) {
              core.setOutput('current', 'false');
              core.notice('AI_REVIEW_OLD_INVALIDATION_EVENT_IGNORED');
              return;
            }
            const eventAt = Date.parse(event.updated_at || '');
            if (!Number.isFinite(eventAt)) throw new Error('INVALIDATION_EVENT_TIME_REQUIRED');
            if (live.labels.some(label => label.name === 'ready-for-final-review')) {
              const result = await github.graphql(`query($owner:String!,$repo:String!,$number:Int!) {
                repository(owner:$owner,name:$repo) { pullRequest(number:$number) {
                  timelineItems(last:50,itemTypes:[LABELED_EVENT,UNLABELED_EVENT]) {
                    nodes { __typename ... on LabeledEvent { createdAt label { name } }
                      ... on UnlabeledEvent { createdAt label { name } } }
                  }
                } }
              }`, { ...context.repo, number: event.number });
              const nodes = result.repository.pullRequest.timelineItems.nodes;
              const latest = [...nodes].reverse().find(node => node.label?.name === 'ready-for-final-review');
              // Same-second timestamps cannot establish that this event precedes the new
              // label. Preserve the label and let exact-head receipt admission decide.
              const labelAt = Date.parse(latest?.createdAt || '');
              // A rejected labeled event must still revoke its own unauthorized/draft
              // request. Only a strictly later label may supersede that event.
              if (latest?.__typename === 'LabeledEvent' &&
                  (labelAt > eventAt || (labelAt === eventAt && action !== 'labeled'))) {
                core.setOutput('current', 'false');
                core.notice('AI_REVIEW_NEWER_READINESS_LABEL_PRESERVED');
              }
            }
      # Organization policy keeps GITHUB_TOKEN read-only. This narrow token is
      # repository-scoped and used only to remove a stale readiness label; no
      # pull-request code is checked out or executed by this base-owned job.
      - name: Remove stale final-head review label
        if: (always()) && steps.invalidation-current.outputs.current == 'true'
        id: remove-stale-label
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          EXPECTED_TOKEN_OWNER: ${{ vars.AI_REVIEW_REQUESTER_LOGIN || 'mercury1231' }}
        with:
          github-token: ${{ secrets.CODEX_REVIEW_TRIGGER_TOKEN }}
          script: |
            const label = 'ready-for-final-review';
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const expectedOwner = process.env.EXPECTED_TOKEN_OWNER.toLowerCase();
            const authenticated = await github.rest.users.getAuthenticated();
            if (authenticated.data.login?.toLowerCase() !== expectedOwner) {
              core.setFailed('AI_REVIEW_TRIGGER_IDENTITY_MISMATCH');
              return;
            }
            let labelRemoved = true;
            if (pr.labels.some((candidate) => candidate.name === label)) {
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: pr.number,
                  name: label,
                });
              } catch (error) {
                // Some organizations intentionally restrict the
                // pull_request_target token from mutating issue labels. The
                // receipt gate below remains fail-closed, so a stale PASS can
                // never authorize this new head; an authorized user must
                // explicitly reapply the label to request a fresh review.
                labelRemoved = false;
                core.warning(`AI_CLI_REVIEW_LABEL_INVALIDATION_DENIED:${error.status || 'unknown'}`);
              }
            }
            core.setOutput('label_removed', labelRemoved ? 'true' : 'false');

      - name: End invalidated review scheduling requests
        if: (always()) && steps.invalidation-current.outputs.current == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const refs = new Set([pr.head.sha, context.payload.before].filter(
              (sha) => /^[0-9a-f]{40}$/i.test(sha || ''),
            ));
            for (const sha of refs) {
              const checks = await github.paginate(github.rest.checks.listForRef,
                { owner, repo, ref: sha, per_page: 100, filter: 'all' });
              for (const check of checks) {
                if (check.app?.id !== 15368 || check.name !== 'ai-review/request' ||
                    check.status === 'completed' || check.head_sha !== sha ||
                    !check.external_id?.startsWith(`ai-review-request:${pr.number}:${sha}:`)) continue;
                await github.rest.checks.update({
                  owner, repo, check_run_id: check.id, status: 'completed', conclusion: 'neutral',
                  completed_at: new Date().toISOString(),
                  output: {
                    title: 'Review scheduling request ended',
                    summary: `The ${context.payload.action} event invalidated this scheduling request. This is not a review verdict.`,
                  },
                });
              }
            }

      # Keep receipt publication on the short-lived workflow token. The
      # dedicated token above never receives Checks permission or merge power.
      - name: Publish final-head review requirement
        if: (always()) && steps.invalidation-current.outputs.current == 'true' && github.event.pull_request.merged != true
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          LABEL_REMOVED: ${{ steps.remove-stale-label.outputs.label_removed }}
        with:
          script: |
            const label = 'ready-for-final-review';
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const upsertInvalidation = async (sha, externalIdPrefix) => {
              const existingChecks = await github.paginate(
                github.rest.checks.listForRef,
                { owner, repo, ref: sha, per_page: 100, filter: 'all' },
              );
              const existing = existingChecks.find((check) =>
                check.name === 'ai-review/receipt' &&
                  check.status !== 'completed' &&
                  check.external_id?.startsWith(`${externalIdPrefix}:`),
              );
              const parameters = {
                owner,
                repo,
                status: 'completed',
                conclusion: 'failure',
                completed_at: new Date().toISOString(),
                output: {
                  title: 'Final-head AI review required',
                  summary: process.env.LABEL_REMOVED === 'true'
                    ? `Apply ${label} to the stable, non-draft PR when it is ready for final review.`
                    : `The workflow could not remove ${label}; remove and reapply it to request final review.`,
                },
              };
              if (existing) {
                await github.rest.checks.update({
                  ...parameters,
                  check_run_id: existing.id,
                });
              } else {
                await github.rest.checks.create({
                  ...parameters,
                  name: 'ai-review/receipt',
                  head_sha: sha,
                  external_id: `${externalIdPrefix}:${context.runId}`,
                });
              }
            };
            await upsertInvalidation(
              pr.head.sha,
              `ai-review-invalidated:${pr.number}:${pr.head.sha}`,
            );
            // Closed, unmerged PRs no longer have a reliable merge ref.
            if (pr.state === 'closed') return;
            try {
              const mergeSha = (await github.rest.git.getRef({
                owner,
                repo,
                ref: `pull/${pr.number}/merge`,
              })).data.object?.sha;
              if (!/^[0-9a-f]{40}$/i.test(mergeSha || '')) {
                throw new Error('merge ref did not resolve to a full SHA');
              }
              await upsertInvalidation(
                mergeSha,
                `ai-review-invalidated:merge:${pr.number}:${pr.head.sha}:${mergeSha}`,
              );
            } catch (error) {
              core.setFailed(`AI_REVIEW_MERGE_INVALIDATION_FAILED:${error.status || error.message || 'unknown'}`);
            }

  request-and-verify-review:
    needs: admit-review-request
    if: >-
      needs.admit-review-request.outputs.admitted == 'true' && ((github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false && github.event.action == 'labeled' && github.event.label.name == 'ready-for-final-review' && github.actor == (vars.AI_REVIEW_REQUESTER_LOGIN || 'mercury1231')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.pr_number > 0 && github.actor == (vars.AI_REVIEW_REQUESTER_LOGIN || 'mercury1231')))
    permissions:
      checks: write
      contents: read
      issues: read
      pull-requests: read
    # Use the same immutable control-plane reference as every consumer
    # repository. A relative call is not reliably matchable by GitHub's
    # restricted runner-group workflow allowlist, which would leave this
    # trust-root repository permanently queued. The exact commit below is
    # separately allowlisted; advancing it requires a reviewed PR.
    uses: ./.github/workflows/codex-cli-review-receipt.yml
    with:
      # workflow_dispatch inputs arrive as strings. Convert explicitly so the
      # reusable workflow's number input receives a JSON number, not "19".
      pr_number: ${{ github.event_name == 'workflow_dispatch' && fromJSON(inputs.pr_number) || 0 }}
      base_branch: main
      # Keep the reusable workflow's requester check exactly aligned with the
      # caller's protected-base authorization check. The value is a repository
      # variable, not a credential, and is passed only as an immutable input.
      automation_login: ${{ vars.AI_REVIEW_REQUESTER_LOGIN || 'mercury1231' }}
    secrets:
      codex_trigger_token: ${{ secrets.CODEX_REVIEW_TRIGGER_TOKEN }}

  reconcile-merge-invalidation:
    needs: request-and-verify-review
    if: >-
      needs.request-and-verify-review.result == 'success' &&
      github.event_name == 'pull_request_target' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'ready-for-final-review'
    runs-on: ${{ fromJSON(vars.CI_GENERAL_RUNS_ON || vars.CI_RUNS_ON || (github.event.repository.private == false && '["ubuntu-latest"]' || '["self-hosted","Linux","X64","linux-general"]')) }}
    permissions:
      checks: write
      contents: read
      actions: read
      issues: read
      pull-requests: read
    steps:
      - name: Reconcile only a verified synthetic merge invalidation
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || 0 }}
          AUTOMATION_LOGIN: ${{ vars.AI_REVIEW_REQUESTER_LOGIN || 'mercury1231' }}
        with:
          script: |
            const number = Number(process.env.PR_NUMBER) || context.payload.pull_request?.number;
            if (!Number.isSafeInteger(number) || number <= 0) {
              core.setFailed('AI_REVIEW_RECONCILE_PR_REQUIRED');
              return;
            }
            const { owner, repo } = context.repo;
            const label = 'ready-for-final-review';
            const getPr = async () => (await github.rest.pulls.get({ owner, repo, pull_number: number })).data;
            const pr = await getPr();
            const currentPr = (value) => value.state === 'open' && !value.draft &&
              value.base.ref === 'main' && value.head.repo?.full_name === `${owner}/${repo}` &&
              (value.labels || []).some((item) => item.name === label);
            // Only the authorized label event may reconcile an earlier marker.
            // A workflow_dispatch review can still publish its head receipt, but
            // cannot silently undo a separate final-head invalidation.
            const authorizedLabelEvent = context.eventName === 'pull_request_target' &&
              context.payload.action === 'labeled' && context.payload.label?.name === label &&
              context.actor === process.env.AUTOMATION_LOGIN &&
              context.payload.pull_request?.number === number &&
              context.payload.pull_request?.head.sha === pr.head.sha;
            if (!authorizedLabelEvent) {
              core.setFailed('AI_REVIEW_RECONCILE_REQUEST_EVENT_NOT_AUTHORIZED');
              return;
            }
            if (!currentPr(pr)) {
              core.setFailed('AI_REVIEW_RECONCILE_PR_NOT_CURRENT');
              return;
            }
            const head = pr.head.sha.toLowerCase();
            const base = pr.base.sha.toLowerCase();
            const checksAt = (ref) => github.paginate(github.rest.checks.listForRef,
              { owner, repo, ref, per_page: 100, filter: 'all' });
            const newest = (checks, predicate) => checks.filter(predicate)
              .sort((a, b) => Number(b.id) - Number(a.id))[0] || null;
            const parse = (check) => {
              const text = check?.output?.text;
              if (typeof text !== 'string' || !text || text.length > 65_535) return null;
              const fenced = text.match(/^```json\s*\n([\s\S]*?)\n```\s*$/);
              try {
                const value = JSON.parse(fenced ? fenced[1] : text);
                return value && typeof value === 'object' && !Array.isArray(value) ? value : null;
              } catch { return null; }
            };
            const headChecks = await checksAt(head);
            const receiptPrefix = `ai-cli-review:${number}:${head}:run:${context.runId}:`;
            const receipt = newest(headChecks, (check) => check.name === 'ai-review/receipt' &&
              check.app?.id === 15368 && check.external_id?.startsWith(receiptPrefix));
            const result = parse(receipt);
            const binding = result?.trusted_binding;
            if (receipt?.status !== 'completed' || receipt.conclusion !== 'success' ||
                result?.status !== 'completed' || result?.decision !== 'PASS' ||
                result?.analysis_complete !== true ||
                result?.pr_number !== number ||
                result?.head_sha?.toLowerCase() !== head || result?.base_sha?.toLowerCase() !== base ||
                binding?.repository !== `${owner}/${repo}` || binding?.pr_number !== number ||
                binding?.head_sha?.toLowerCase() !== head || binding?.base_sha?.toLowerCase() !== base) {
              core.setFailed('AI_REVIEW_RECONCILE_RECEIPT_NOT_VERIFIED');
              return;
            }
            const ref = `pull/${number}/merge`;
            const merge = (await github.rest.git.getRef({ owner, repo, ref })).data.object?.sha?.toLowerCase();
            if (!/^[0-9a-f]{40}$/.test(merge || '')) {
              core.setFailed('AI_REVIEW_RECONCILE_MERGE_REF_INVALID');
              return;
            }
            const commit = (await github.rest.repos.getCommit({ owner, repo, ref: merge })).data;
            const parents = (commit.parents || []).map((item) => item.sha.toLowerCase());
            if (parents.length !== 2 || !parents.includes(base) || !parents.includes(head) ||
                result.merge_sha?.toLowerCase() !== merge ||
                binding.reviewed_merge_sha?.toLowerCase() !== merge ||
                binding.merge_tree_sha?.toLowerCase() !== commit.commit.tree.sha.toLowerCase()) {
              core.setFailed('AI_REVIEW_RECONCILE_MERGE_NOT_VERIFIED');
              return;
            }
            const verdictId = `ai-review/verdict:${number}:${head}:${merge}:${context.runId}:head`;
            const executionId = `ai-review/execution:${number}:${head}:${merge}:${context.runId}:head`;
            const passed = (checks, name, id) => newest(checks, (check) => check.name === name &&
              check.app?.id === 15368 && check.external_id === id &&
              check.status === 'completed' && check.conclusion === 'success');
            const verdict = passed(headChecks, 'ai-review/verdict', verdictId);
            const execution = passed(headChecks, 'ai-review/execution', executionId);
            if (!verdict || !execution) {
              core.setFailed('AI_REVIEW_RECONCILE_VERDICT_NOT_VERIFIED');
              return;
            }
            const prefix = `ai-review-invalidated:merge:${number}:${head}:${merge}:`;
            const markerAt = (checks) => newest(checks, (check) => check.name === 'ai-review/receipt' &&
              check.app?.id === 15368 && check.external_id?.startsWith(prefix));
            const marker = markerAt(await checksAt(merge));
            if (!marker) {
              core.notice('AI_REVIEW_RECONCILE_MARKER_NOT_NEEDED');
              return;
            }
            const alreadyDone = (check) => check.status === 'completed' &&
              check.conclusion === 'neutral' && check.output?.title === 'Synthetic merge invalidation reconciled';
            if (alreadyDone(marker)) {
              core.notice('AI_REVIEW_RECONCILE_ALREADY_DONE');
              return;
            }
            if (marker.status !== 'completed' ||
                !['failure', 'action_required'].includes(marker.conclusion) ||
                !['Final-head AI review required', 'Final-head AI review not requested']
                  .includes(marker.output?.title)) {
              core.setFailed('AI_REVIEW_RECONCILE_MARKER_UNEXPECTED');
              return;
            }
            const markerRunMatch = marker.external_id.match(
              new RegExp(`^ai-review-invalidated:merge:${number}:${head}:${merge}:([1-9][0-9]*)$`));
            const markerRunId = Number(markerRunMatch?.[1]);
            if (!Number.isSafeInteger(markerRunId)) {
              core.setFailed('AI_REVIEW_RECONCILE_MARKER_RUN_INVALID');
              return;
            }
            const [requestRunResponse, markerRunResponse] = await Promise.all([
              github.rest.actions.getWorkflowRun({ owner, repo, run_id: context.runId }),
              github.rest.actions.getWorkflowRun({ owner, repo, run_id: markerRunId }),
            ]);
            const requestRun = requestRunResponse.data;
            const markerRun = markerRunResponse.data;
            const callerPath = '.github/workflows/codex-review-receipt-caller.yml';
            const protectedCallerPath = (run) => run.path === callerPath ||
              run.path === `${callerPath}@refs/heads/main`;
            const requestTime = Date.parse(requestRun.created_at);
            const markerTime = Date.parse(marker.completed_at);
            const markerRunTime = Date.parse(markerRun.created_at);
            if (!protectedCallerPath(requestRun) || requestRun.event !== 'pull_request_target' ||
                requestRun.actor?.login !== process.env.AUTOMATION_LOGIN ||
                !protectedCallerPath(markerRun) || markerRun.event !== 'pull_request_target' ||
                !Number.isFinite(requestTime) || !Number.isFinite(markerTime) ||
                !Number.isFinite(markerRunTime) || markerRunTime > markerTime ||
                markerTime >= requestTime) {
              core.setFailed('AI_REVIEW_RECONCILE_MARKER_NOT_PRIOR_TO_REQUEST');
              return;
            }
            const readyEvents = async () => (await github.paginate(github.rest.issues.listEvents,
              { owner, repo, issue_number: number, per_page: 100 }))
              .filter((event) => event.label?.name === label &&
                ['labeled', 'unlabeled'].includes(event.event))
              .sort((a, b) => Number(b.id) - Number(a.id));
            const ready = await readyEvents();
            const latestReady = ready[0];
            const labelTime = Date.parse(latestReady?.created_at);
            if (!latestReady || latestReady.event !== 'labeled' ||
                latestReady.actor?.login !== process.env.AUTOMATION_LOGIN ||
                !Number.isFinite(labelTime) || markerTime >= labelTime ||
                labelTime > requestTime ||
                ready.filter((event) => Date.parse(event.created_at) === requestTime).length > 1) {
              core.setFailed('AI_REVIEW_RECONCILE_LABEL_EVENT_CHANGED');
              return;
            }
            const [freshPr, freshRef, freshHead, freshMerge] = await Promise.all([
              getPr(), github.rest.git.getRef({ owner, repo, ref }), checksAt(head), checksAt(merge),
            ]);
            const freshReceipt = newest(freshHead, (check) => check.name === 'ai-review/receipt');
            const freshMarker = markerAt(freshMerge);
            const freshReady = (await readyEvents())[0];
            if (!currentPr(freshPr) || freshPr.head.sha.toLowerCase() !== head ||
                freshPr.base.sha.toLowerCase() !== base ||
                freshRef.data.object?.sha?.toLowerCase() !== merge ||
                freshReceipt?.id !== receipt.id || freshReceipt.conclusion !== 'success' ||
                freshReceipt?.external_id !== receipt.external_id ||
                freshReceipt?.output?.text !== receipt.output?.text ||
                passed(freshHead, 'ai-review/verdict', verdictId)?.id !== verdict.id ||
                passed(freshHead, 'ai-review/execution', executionId)?.id !== execution.id ||
                freshMarker?.id !== marker.id || freshMarker?.status !== marker.status ||
                freshMarker?.conclusion !== marker.conclusion ||
                freshMarker?.external_id !== marker.external_id ||
                freshMarker?.output?.title !== marker.output?.title ||
                freshMarker?.completed_at !== marker.completed_at ||
                freshReady?.id !== latestReady.id) {
              core.setFailed('AI_REVIEW_RECONCILE_FINAL_FENCE_CHANGED');
              return;
            }
            await github.rest.checks.update({
              owner, repo, check_run_id: marker.id, status: 'completed', conclusion: 'neutral',
              completed_at: new Date().toISOString(),
              output: {
                title: 'Synthetic merge invalidation reconciled',
                summary: 'Exact head, base, merge parents and tree, receipt, execution and verdict were verified twice. The original review PASS remains on the head.',
              },
            });
