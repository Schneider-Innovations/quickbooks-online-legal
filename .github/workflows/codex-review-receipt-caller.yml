name: Codex exact-head review request

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

# This caller is resolved from the protected base branch. It never checks out
# or executes pull-request-controlled code. The central workflow is pinned to
# an immutable commit and fails closed when exact-head evidence is unavailable.
permissions:
  contents: read

concurrency:
  group: codex-review-receipt-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  request-and-verify-review:
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    permissions:
      checks: write
      contents: read
      pull-requests: read
    # Public repositories cannot call a reusable workflow hosted in a private
    # repository. This base-owned local CLI receipt workflow never executes
    # pull-request-controlled code and carries no Connector trigger token.
    uses: ./.github/workflows/codex-cli-review-receipt.yml
    with:
      pr_number: 0
      base_branch: main

