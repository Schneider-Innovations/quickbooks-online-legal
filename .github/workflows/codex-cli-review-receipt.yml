        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            // A workflow cancellation can stop a queued verifier before any
            // of its steps start. This separate always-scheduled job closes
            // that gap after the verifier reaches any terminal job result.
            const requestId = process.env.REQUEST_ID || '';
            if (!/^cli-[0-9]+-[0-9]+-[0-9]+-[0-9a-f]+$/.test(requestId)) {
              core.setFailed('AI_CLI_REVIEW_TERMINAL_REQUEST_INVALID');
              return;
            }
            if (process.env.PRODUCER_RECEIPT_OBSERVED !== 'true') {
              const digest = process.env.CANCEL_SUBJECT_DIGEST || '';
              const attempt = Number(process.env.CANCEL_ATTEMPT_NUMBER);
              if (!/^[0-9a-f]{64}$/.test(digest) || !Number.isSafeInteger(attempt) || attempt < 1) {
                core.setFailed('AI_CLI_REVIEW_CANCEL_BINDING_INVALID');
                return;
              }
              const cancelIncoming = '/var/lib/codex-review-bridge/cancel-incoming';
              const cancelAcks = '/var/lib/codex-review-bridge/cancel-acks';
              const sequence = 1;
              const command = {
                schema_version: '2.0', request_id: requestId, cancel_sequence: sequence,
                reason: 'expired', created_at: new Date().toISOString(),
                subject_digest: digest, lease_generation: 1, attempt_number: attempt,
              };
              const target = path.join(cancelIncoming, `${requestId}.${sequence}.json`);
              const temporary = path.join(cancelIncoming, `.${requestId}.${sequence}.${process.pid}.tmp`);
              fs.writeFileSync(temporary, `${JSON.stringify(command)}\n`, { flag: 'wx', mode: 0o600 });
              const temporaryFd = fs.openSync(temporary, 'r');
              try { fs.fsyncSync(temporaryFd); } finally { fs.closeSync(temporaryFd); }
              try { fs.linkSync(temporary, target); } catch (error) {
                if (error.code !== 'EEXIST') throw error;
              } finally {
                fs.rmSync(temporary);
              }
              const cancelDirectoryFd = fs.openSync(cancelIncoming, 'r');
              try { fs.fsyncSync(cancelDirectoryFd); } finally { fs.closeSync(cancelDirectoryFd); }
              const ackPath = path.join(cancelAcks, `${requestId}.${sequence}.json`);
              const deadline = Date.now() + 60 * 1000;
              let resolution = null;
              while (Date.now() < deadline) {
                if (fs.existsSync(ackPath)) {
                  resolution = JSON.parse(fs.readFileSync(ackPath, 'utf8'));
                  break;
                }
                await new Promise((resolve) => setTimeout(resolve, 1000));
              }
              if (!resolution || resolution.request_id !== requestId ||
                  resolution.cancel_sequence !== sequence ||
                  !['ACCEPTED', 'OBSOLETE_AFTER_TERMINAL'].includes(resolution.state)) {
                core.setFailed('AI_CLI_REVIEW_CANCEL_NOT_ACCEPTED');
                return;
              }
              core.info(`AI_CLI_REVIEW_CANCEL_${resolution.state}`);
            }
            const ready = '/var/lib/codex-review-bridge/outgoing/ready';
            const marker = path.join(ready, `${requestId}.terminal`);
            try {
              const fd = fs.openSync(marker, 'wx', 0o600);
              try { fs.fsyncSync(fd); } finally { fs.closeSync(fd); }
            } catch (error) {
              if (error.code !== 'EEXIST') throw error;
              const metadata = fs.lstatSync(marker);
              if (!metadata.isFile() || metadata.nlink !== 1 || metadata.size !== 0 ||
                  metadata.uid !== process.getuid() || (metadata.mode & 0o777) !== 0o600) {
                throw new Error('AI_CLI_REVIEW_TERMINAL_MARKER_INVALID');
              }
            }
            const directoryFd = fs.openSync(ready, 'r');
            try { fs.fsyncSync(directoryFd); } finally { fs.closeSync(directoryFd); }
            const root = path.resolve('/var/lib/codex-review-bridge/incoming');
            const target = path.resolve(root, process.env.REQUEST_ID);
            if (!target.startsWith(`${root}${path.sep}`)) {
              core.setFailed('AI_CLI_REVIEW_CLEANUP_PATH_INVALID');
              return;
            }
            fs.rmSync(target, { recursive: true, force: true });

  finalize-review-request:
    name: Finalize review scheduling request
    needs:
      - prepare-cli-review
      - await-cli-review
    if: always()
    # Keep this base-owned API-only cleanup independent of review compute.
    # Require the trusted control-plane pool without a hosted fallback.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: End matching non-gating request contract
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          PR_NUMBER: ${{ needs.prepare-cli-review.outputs.pr_number || inputs.pr_number }}
          HEAD_SHA: ${{ needs.prepare-cli-review.outputs.head_sha }}
          MERGE_SHA: ${{ needs.prepare-cli-review.outputs.merge_sha }}
          MERGE_TREE_SHA: ${{ needs.prepare-cli-review.outputs.merge_tree_sha }}
          MERGE_BASE_SHA: ${{ needs.prepare-cli-review.outputs.merge_base_sha }}
          HEAD_CHECK_RUN_ID: ${{ needs.prepare-cli-review.outputs.head_check_run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REQUEST_GENERATION: ${{ inputs.request_generation }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          REQUIRED_LABEL: ${{ inputs.required_label }}
          PREPARE_RESULT: ${{ needs.prepare-cli-review.result }}
          RECEIPT_RESULT: ${{ needs.await-cli-review.outputs.receipt_step_outcome || needs.await-cli-review.result }}
        with:
          retries: 3
          retry-exempt-status-codes: 400,401,403,404,422
          script: |
            const requestedPrNumber = Number(process.env.PR_NUMBER);
            const eventPrNumber = Number(context.payload.pull_request?.number || 0);
            const prNumber = requestedPrNumber > 0 ? requestedPrNumber : eventPrNumber;
            if (!Number.isInteger(prNumber) || prNumber < 1) {
              core.setFailed('AI_REVIEW_REQUEST_FINALIZE_PR_CONTEXT_REQUIRED');
              return;
            }
            // pull_request_target carries an event snapshot. Re-read the live
            // PR before every state projection so a delayed labeled/unlabeled
            // event cannot authorize a stale head or resurrect a revoked PASS.
            const pr = (await github.rest.pulls.get({
              ...context.repo,
              pull_number: prNumber,
            })).data;
            const protectedBaseRef = await github.rest.git.getRef({
              ...context.repo, ref: `heads/${process.env.BASE_BRANCH || 'main'}`,
            });
            const protectedBaseSha = protectedBaseRef.data.object?.sha?.toLowerCase();
            if (!/^[0-9a-f]{40}$/.test(protectedBaseSha || '')) {
              core.setFailed('AI_REVIEW_REQUEST_FINALIZE_BASE_INVALID');
              return;
            }
            const headSha = (process.env.HEAD_SHA || pr.head.sha || '').toLowerCase();
            if (!/^[0-9a-f]{40}$/.test(headSha)) {
              core.setFailed('AI_REVIEW_REQUEST_FINALIZE_HEAD_INVALID');
              return;
            }
            const runAttempt = Number(process.env.RUN_ATTEMPT || '1');
            if (!Number.isInteger(runAttempt) || runAttempt < 1) {
              core.setFailed('AI_REVIEW_REQUEST_FINALIZE_ATTEMPT_INVALID');
              return;
            }
            const attemptGeneration = `${context.runId}:${runAttempt}`;
            const requestPrefix = `ai-review-request:${pr.number}:${headSha}:`;
            const suppliedGeneration = process.env.REQUEST_GENERATION || '';
            if (suppliedGeneration && !/^\d+(?::[1-9]\d*)?$/.test(suppliedGeneration)) {
              core.setFailed('AI_REVIEW_REQUEST_FINALIZE_GENERATION_INVALID');
              return;
            }
            const externalIds = new Set(
              [suppliedGeneration, attemptGeneration, String(context.runId)]
                .filter(Boolean)
                .map((generation) => `${requestPrefix}${generation}`),
            );
            const checks = await github.paginate(
              github.rest.checks.listForRef,
              { ...context.repo, ref: headSha, per_page: 100, filter: 'all' },
            );
            const parseCheckOutput = (check) => {
              const text = check?.output?.text || '';
              if (typeof text !== 'string' || text.length === 0 || text.length > 65_535) return null;
              const fenced = text.match(/^```json\s*\n([\s\S]*?)\n```\s*$/);
              try {
                const parsed = JSON.parse(fenced ? fenced[1] : text);
                return parsed && typeof parsed === 'object' && !Array.isArray(parsed)
                  ? parsed
                  : null;
              } catch {
                return null;
              }
            };
            const parseRequestGeneration = (check) => {
              const suffix = check.external_id?.startsWith(requestPrefix)
                ? check.external_id.slice(requestPrefix.length)
                : '';
              const match = suffix.match(/^(\d+)(?::([1-9]\d*))?$/);
              if (!match) return null;
              return { runId: BigInt(match[1]), attempt: Number(match[2] || '1') };
            };
            const compareGeneration = (left, right) =>
              left.runId < right.runId ? -1
                : left.runId > right.runId ? 1
                  : left.attempt - right.attempt;
            const requestOutputMatches = (check) => {
              const output = parseCheckOutput(check);
              if (!output) return false;
              if (output.schema === 'ai-review-request/v1') {
                return output.repository === `${context.repo.owner}/${context.repo.repo}` &&
                  Number(output.pr_number) === pr.number &&
                  output.head_sha?.toLowerCase() === headSha;
              }
              if (output.schema === 'ai-review-lifecycle/v2') {
                return output.repository === `${context.repo.owner}/${context.repo.repo}` &&
                  Number(output.pr_number) === pr.number &&
                  output.binding?.head_sha?.toLowerCase() === headSha;
              }
              return false;
            };
            const trustedRequestChecks = checks.filter((check) =>
              check.name === 'ai-review/request' &&
              check.head_sha?.toLowerCase() === headSha &&
              check.app?.slug === 'github-actions' &&
              parseRequestGeneration(check) &&
              requestOutputMatches(check),
            );
            const matching = trustedRequestChecks.filter((check) => externalIds.has(check.external_id));
            if (matching.length === 0) {
              // Older callers do not publish the optional scheduling Check.
              // Keep this pin backward-compatible while callers migrate.
              core.notice('AI_REVIEW_REQUEST_FINALIZE_NOT_PUBLISHED');
              return;
            }
            if (matching.length !== 1) {
              core.setFailed('AI_REVIEW_REQUEST_FINALIZE_IDENTITY_AMBIGUOUS');
              return;
            }
            const requestCheck = matching[0];
            if (requestCheck.status === 'completed' && requestCheck.conclusion !== 'neutral') {
              core.notice('AI_REVIEW_REQUEST_FINALIZE_ALREADY_TERMINAL');
              return;
            }
            const parseCheckId = (value) => {
              const parsed = Number(value || '0');
              return Number.isSafeInteger(parsed) && parsed > 0 ? parsed : null;
            };
            const headCheckId = parseCheckId(process.env.HEAD_CHECK_RUN_ID);
            const mergeSha = (process.env.MERGE_SHA || '').toLowerCase();
            const mergeTreeSha = (process.env.MERGE_TREE_SHA || '').toLowerCase();
            const mergeBaseSha = (process.env.MERGE_BASE_SHA || '').toLowerCase();
            const prepareResult = process.env.PREPARE_RESULT;
            const receiptResult = process.env.RECEIPT_RESULT;
            let phase = 'UNAVAILABLE';
            let reasonCode = receiptResult === 'cancelled'
              ? 'workflow_cancelled'
              : prepareResult !== 'success'
                ? 'gate_unreachable'
                : 'lifecycle_abandoned';
            let outcome = 'UNAVAILABLE';
            let nextAction = 'restore_service';
            let policyDigest = null;
            if (headCheckId && /^[0-9a-f]{40}$/.test(mergeSha) && /^[0-9a-f]{40}$/.test(mergeTreeSha)) {
              const headReceipt = await github.rest.checks.get({
                ...context.repo, check_run_id: headCheckId,
              });
              const headData = headReceipt.data;
              const headOutput = parseCheckOutput(headData);
              const terminalReceipt =
                headData.name === 'ai-review/receipt' &&
                headData.app?.slug === 'github-actions' &&
                headData.status === 'completed' &&
                headData.head_sha?.toLowerCase() === headSha;
              const trustedBinding = headOutput?.trusted_binding;
              const receiptBinding = terminalReceipt &&
                headOutput?.head_sha?.toLowerCase() === headSha &&
                headOutput?.merge_sha?.toLowerCase() === mergeSha &&
                headOutput?.base_sha?.toLowerCase() === protectedBaseSha &&
                headOutput?.merge_base_sha?.toLowerCase() === mergeBaseSha &&
                Number(headOutput?.pr_number) === pr.number &&
                trustedBinding?.schema === 'ai-review-head-binding/v1' &&
                trustedBinding?.repository === `${context.repo.owner}/${context.repo.repo}` &&
                Number(trustedBinding?.pr_number) === pr.number &&
                trustedBinding?.base_sha?.toLowerCase() === protectedBaseSha &&
                trustedBinding?.head_sha?.toLowerCase() === headSha &&
                trustedBinding?.reviewed_merge_sha?.toLowerCase() === mergeSha &&
                trustedBinding?.merge_tree_sha?.toLowerCase() === mergeTreeSha &&
                trustedBinding?.policy_digest === (headOutput?.policy_digest || null) &&
                trustedBinding?.request_generation === process.env.REQUEST_GENERATION;
              const generationStartedAt = headData.external_id?.match(
                new RegExp(`^ai-cli-review:${pr.number}:${headSha}:run:${context.runId}:(\\d{13})$`),
              )?.[1];
              const receiptGenerationBinding = Boolean(generationStartedAt);
              let liveMergeSha = null;
              let liveMergeTreeSha = null;
              try {
                liveMergeSha = (await github.rest.git.getRef({
                  ...context.repo,
                  ref: `pull/${pr.number}/merge`,
                })).data.object?.sha?.toLowerCase() || null;
                const liveMerge = await github.rest.repos.getCommit({ ...context.repo, ref: liveMergeSha });
                const parents = (liveMerge.data.parents || []).map((parent) => parent.sha?.toLowerCase());
                liveMergeTreeSha = parents.length === 2 &&
                  parents[0] === protectedBaseSha && parents[1] === headSha
                  ? liveMerge.data.commit?.tree?.sha?.toLowerCase() || null
                  : null;
              } catch {
                liveMergeSha = null;
                liveMergeTreeSha = null;
              }
              const newestReceipt = (candidates) => candidates
                .filter((check) => check.name === 'ai-review/receipt')
                .sort((left, right) => Number(right.id || 0) - Number(left.id || 0))[0] || null;
              const newestRequest = trustedRequestChecks
                .sort((left, right) => Number(right.id || 0) - Number(left.id || 0))[0] || null;
              const liveScope =
                pr.state === 'open' &&
                pr.draft === false &&
                pr.base.ref === (process.env.BASE_BRANCH || 'main') &&
                pr.base.sha?.toLowerCase() === protectedBaseSha &&
                protectedBaseSha === headOutput?.base_sha?.toLowerCase() &&
                pr.head.sha?.toLowerCase() === headSha &&
                pr.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}` &&
                (pr.labels || []).some((label) => label.name === (process.env.REQUIRED_LABEL || 'ready-for-final-review')) &&
                liveMergeTreeSha === mergeTreeSha;
              const approvalFence =
                liveScope &&
                receiptBinding &&
                receiptGenerationBinding &&
                newestReceipt(checks)?.id === headData.id &&
                newestRequest?.id === requestCheck.id;
              if (
                approvalFence &&
                headData.conclusion === 'success' &&
                headOutput?.status === 'completed' &&
                (headOutput?.decision === 'PASS' || headOutput?.decision === 'BLOCK')
              ) {
                // A success conclusion with a BLOCK decision means every
                // reported finding fell into the deferred tier: the gate is
                // satisfied and the findings remain in the exact-head receipt.
                phase = 'APPROVED';
                reasonCode = headOutput?.decision === 'BLOCK'
                  ? 'review_approved_deferred_findings'
                  : 'review_approved';
                outcome = 'PASS';
                nextAction = 'none';
              } else if (receiptBinding && headOutput?.decision === 'BLOCK') {
                phase = 'BLOCKED';
                reasonCode = 'review_blocked';
                outcome = 'BLOCK';
                nextAction = 'inspect_findings';
              } else if (terminalReceipt && headOutput?.status === 'unavailable') {
                reasonCode = 'review_unavailable';
              } else if (
                receiptBinding &&
                (headOutput?.decision === 'INCONCLUSIVE' || headOutput?.decision === 'PASS')
              ) {
                phase = 'INCONCLUSIVE';
                reasonCode = 'review_inconclusive';
                outcome = 'INCONCLUSIVE';
                nextAction = 'investigate_inconclusive';
              }
              const candidatePolicyDigest = headOutput?.policy_digest;
              if (
                receiptBinding &&
                typeof candidatePolicyDigest === 'string' &&
                /^[0-9a-f]{64}$/.test(candidatePolicyDigest)
              ) {
                policyDigest = candidatePolicyDigest;
              }
              if (phase === 'APPROVED') {
                const currentGeneration = parseRequestGeneration(requestCheck);
                const legacyRequests = trustedRequestChecks
                  .filter((check) => {
                    const generation = parseRequestGeneration(check);
                    return check.id !== requestCheck.id &&
                      check.status === 'completed' &&
                      check.conclusion === 'neutral' &&
                      generation && currentGeneration &&
                      compareGeneration(generation, currentGeneration) < 0;
                  })
                  .sort((left, right) => Number(left.id || 0) - Number(right.id || 0));
                for (const check of legacyRequests) {
                  await github.rest.checks.update({
                    ...context.repo,
                    check_run_id: check.id,
                    status: 'completed',
                    conclusion: 'success',
                    completed_at: new Date().toISOString(),
                  });
                  const readback = (await github.rest.checks.get({
                    ...context.repo,
                    check_run_id: check.id,
                  })).data;
                  if (readback.status !== 'completed' || readback.conclusion !== 'success') {
                    core.setFailed('AI_REVIEW_REQUEST_RECONCILE_READBACK_MISMATCH');
                    return;
                  }
                }

                // The current Request remains neutral/in-progress while old
                // generations are repaired. Re-read every authorization fence
                // before the final write that can make the aggregate green.
                const [freshPrResponse, freshHeadReceipt, freshMergeRef, freshBaseRef] = await Promise.all([
                  github.rest.pulls.get({ ...context.repo, pull_number: pr.number }),
                  github.rest.checks.get({ ...context.repo, check_run_id: headData.id }),
                  github.rest.git.getRef({ ...context.repo, ref: `pull/${pr.number}/merge` }),
                  github.rest.git.getRef({ ...context.repo, ref: `heads/${process.env.BASE_BRANCH || 'main'}` }),
                ]);
                const freshHeadChecks = await github.paginate(
                  github.rest.checks.listForRef,
                  { ...context.repo, ref: headSha, per_page: 100, filter: 'all' },
                );
                const freshPr = freshPrResponse.data;
                const freshHeadData = freshHeadReceipt.data;
                const freshMergeSha = freshMergeRef.data.object?.sha?.toLowerCase();
                const freshMergeCommit = await github.rest.repos.getCommit({
                  ...context.repo, ref: freshMergeSha,
                });
                const freshMergeParents = (freshMergeCommit.data.parents || [])
                  .map((parent) => parent.sha?.toLowerCase());
                const freshMergeTree = freshMergeCommit.data.commit?.tree?.sha?.toLowerCase();
                const freshRequestChecks = freshHeadChecks.filter((check) =>
                  check.name === 'ai-review/request' &&
                  check.head_sha?.toLowerCase() === headSha &&
                  check.app?.slug === 'github-actions' &&
                  parseRequestGeneration(check) &&
                  requestOutputMatches(check),
                );
                const freshNewestRequest = freshRequestChecks
                  .sort((left, right) => Number(right.id || 0) - Number(left.id || 0))[0] || null;
                const freshScope =
                  freshPr.state === 'open' &&
                  freshPr.draft === false &&
                  freshPr.base.ref === (process.env.BASE_BRANCH || 'main') &&
                  freshPr.base.sha?.toLowerCase() === protectedBaseSha &&
                  freshBaseRef.data.object?.sha?.toLowerCase() === protectedBaseSha &&
                  freshPr.head.sha?.toLowerCase() === headSha &&
                  freshPr.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}` &&
                  (freshPr.labels || []).some((label) => label.name === (process.env.REQUIRED_LABEL || 'ready-for-final-review')) &&
                  freshMergeTree === mergeTreeSha &&
                  freshMergeParents.length === 2 &&
                  freshMergeParents[0] === protectedBaseSha && freshMergeParents[1] === headSha;
                const freshReceipt =
                  freshHeadData.status === 'completed' &&
                  freshHeadData.conclusion === 'success' &&
                  freshHeadData.external_id === headData.external_id &&
                  JSON.stringify(parseCheckOutput(freshHeadData)) === JSON.stringify(headOutput) &&
                  newestReceipt(freshHeadChecks)?.id === headData.id &&
                  freshNewestRequest?.id === requestCheck.id;
                if (!freshScope || !freshReceipt) {
                  core.setFailed('AI_REVIEW_REQUEST_RECONCILE_FENCE_CHANGED');
                  return;
                }
              }
            }
            const now = new Date().toISOString();
            // This remains a non-gating scheduling record: ai-review/receipt
            // is still the only review verdict.  GitHub nevertheless folds
            // every Check conclusion into mergeStateStatus.  A neutral
            // terminal Request therefore leaves an otherwise fully-passing
            // pull request UNSTABLE.  Mark only a verified APPROVED lifecycle
            // as successful; every non-approved terminal outcome stays
            // neutral and its Receipt remains fail-closed.
            const schedulingConclusion = phase === 'APPROVED' ? 'success' : 'neutral';
            const request = {
              schema: 'ai-review-lifecycle/v2',
              lifecycle_id: `${context.repo.owner}/${context.repo.repo}:${pr.number}:${headSha}`,
              phase,
              reason_code: reasonCode,
              repository: `${context.repo.owner}/${context.repo.repo}`,
              pr_number: pr.number,
              binding: {
                base_sha: protectedBaseSha,
                head_sha: headSha,
                merge_base_sha: /^[0-9a-f]{40}$/.test(mergeBaseSha) ? mergeBaseSha : null,
                merge_preview_sha: /^[0-9a-f]{40}$/.test(mergeSha) ? mergeSha : null,
                policy_digest: policyDigest,
              },
              timing: {
                phase_started_at: now,
                deadline_at: null,
                request_wait_started_at: null,
                request_wait_age_seconds: null,
              },
              terminal: true,
              outcome,
              next_action: {
                code: nextAction,
                summary: phase === 'APPROVED'
                  ? 'The exact-head receipt was published; continue with the remaining merge gates.'
                  : phase === 'BLOCKED'
                    ? 'Inspect and resolve the blocking review findings before requesting a new review.'
                    : phase === 'INCONCLUSIVE'
                      ? 'Investigate the inconclusive review evidence and request a fresh review.'
                      : 'Restore the trusted review gate, then request a fresh exact-head review.',
              },
            };
            if (requestCheck.status === 'completed' && phase !== 'APPROVED') {
              core.notice('AI_REVIEW_REQUEST_FINALIZE_ALREADY_TERMINAL');
              return;
            }
            await github.rest.checks.update({
              ...context.repo,
              check_run_id: requestCheck.id,
              status: 'completed',
              conclusion: schedulingConclusion,
              completed_at: now,
              output: {
                title: phase === 'APPROVED'
                  ? 'AI review request completed'
                  : phase === 'BLOCKED'
                    ? 'AI review completed with blocking findings'
                    : phase === 'INCONCLUSIVE'
                      ? 'AI review completed without a conclusive decision'
                      : 'AI review lifecycle unavailable',
                summary: 'The scheduling contract is terminal. ai-review/receipt remains the sole review verdict.',
                text: `\`\`\`json\n${JSON.stringify(request)}\n\`\`\``,
              },
            });
