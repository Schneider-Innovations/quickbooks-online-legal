              const protocolVersion = process.env.REVIEW_CALLER_CONTRACT_VERSION || '';
              const workflowRepository = process.env.CALLED_WORKFLOW_REPOSITORY || '';
              const workflowPath = process.env.CALLED_WORKFLOW_PATH || '';
              const workflowSha = process.env.CALLED_WORKFLOW_SHA || '';
              if (
                !/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(workflowRepository) ||
                workflowPath !== '.github/workflows/codex-cli-review-receipt.yml' ||
                !/^[0-9a-f]{40}$/.test(workflowSha) ||
                (releaseId && !/^review-[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]+$/.test(releaseId)) ||
                (protocolVersion && protocolVersion !== '1') ||
                (releaseId && protocolVersion)
              ) {
                throw new Error('AI_REVIEW_CHECK_ARCHIVE_PROVENANCE_INVALID');
              }
              const exported = {
                schema: protocolVersion
                  ? 'ai-review-check-export/v3'
                  : (releaseId ? 'ai-review-check-export/v2' : 'ai-review-check-export/v1'),
                repository: `${context.repo.owner}/${context.repo.repo}`,
                workflow_run_id: context.runId,
                workflow_run_attempt: reviewRunAttempt,
                recorded_at: new Date().toISOString(),
                check_run: selected,
              };
              if (releaseId) {
                exported.workflow_ref = `${workflowRepository}/${workflowPath}@${workflowSha}`;
                exported.caller_claimed_release_id = releaseId;
              }
              if (protocolVersion) {
