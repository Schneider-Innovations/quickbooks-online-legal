            const readyPath = path.resolve(readyRoot, `${requestId}.json`);
            const legacyPath = path.resolve(legacyRoot, `${requestId}.json`);
            const inputPath = path.resolve(incomingRoot, requestId);
            if (!readyPath.startsWith(`${readyRoot}${path.sep}`) ||
