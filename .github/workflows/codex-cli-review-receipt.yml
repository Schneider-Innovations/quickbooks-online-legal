name: Codex CLI review receipt

on:
  workflow_call:
    inputs:
      pr_number:
        description: Optional PR number for a protected-main reconciliation run.
        required: false
        type: number
        default: 0
      base_branch:
        description: Protected base branch expected for every reviewed PR.
        required: false
        type: string
        default: main
      required_label:
        description: Exact label that explicitly requests final-head review.
        required: false
        type: string
        default: ready-for-final-review
      automation_login:
        description: GitHub login reserved for protected-main reconciliation automation.
        required: false
        type: string
      request_generation:
        description: Exact scheduling generation published by the guarded caller.
        required: false
        type: string
        default: ''
      review_release_id:
        description: Deprecated bounded compatibility input for pre-protocol callers.
        required: false
        type: string
        default: ''
      review_caller_contract_version:
        description: Stable Review caller protocol version; the central verifier derives the active release.
        required: false
        type: string
        default: ''
    # Every protected caller has one canonical, guarded secret mapping. Keep
    # the interface declaration so GitHub can validate the reusable call, but
    # never reference this secret in a job, environment, or bridge command.
    secrets:
      codex_trigger_token:
        required: false

# This workflow is only called by the base-owned pull_request_target caller in
# this repository. It checks out a same-repository PR snapshot but never runs
# its code. The Actions token is not passed to the Codex service account.
permissions:
  checks: write
  contents: read
  issues: read
  pull-requests: read

jobs:
  prepare-cli-review:
    name: Prepare isolated CLI review
    runs-on:
      group: code-review
      labels: [self-hosted, code-review, cli-review, shadow-only]
    timeout-minutes: 6
    outputs:
      base_sha: ${{ steps.context.outputs.base_sha }}
      head_sha: ${{ steps.context.outputs.head_sha }}
      merge_sha: ${{ steps.context.outputs.merge_sha }}
      merge_tree_sha: ${{ steps.context.outputs.merge_tree_sha }}
      merge_ref_attempts: ${{ steps.context.outputs.merge_ref_attempts }}
      merge_ref_wait_ms: ${{ steps.context.outputs.merge_ref_wait_ms }}
      merge_base_sha: ${{ steps.input.outputs.merge_base_sha }}
      cancel_subject_digest: ${{ steps.input.outputs.cancel_subject_digest }}
      cancel_attempt_number: ${{ steps.input.outputs.cancel_attempt_number }}
      pr_number: ${{ steps.context.outputs.pr_number }}
      request_id: ${{ steps.context.outputs.request_id }}
      head_check_run_id: ${{ steps.receipt.outputs.head_check_run_id }}
    steps:
      - id: context
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          REQUIRED_LABEL: ${{ inputs.required_label }}
          AUTOMATION_LOGIN: ${{ inputs.automation_login }}
          REVIEW_RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          script: |
            const requestedPrNumber = Number(process.env.PR_NUMBER);
            const requiredLabel = process.env.REQUIRED_LABEL;
            const automationLogin = (process.env.AUTOMATION_LOGIN || '').toLowerCase();
            const actor = (context.actor || '').toLowerCase();
            const { owner, repo } = context.repo;
            const pullNumber = requestedPrNumber || context.payload.pull_request?.number;
            if (!Number.isInteger(pullNumber) || pullNumber <= 0) {
              core.setFailed('AI_CLI_REVIEW_PR_CONTEXT_REQUIRED');
              return;
            }
            // pull_request_target carries an event snapshot. Always establish
            // the review identity from GitHub's current PR before reading its
            // synthetic merge ref, and repeat that check on every retry below.
            const pr = (await github.rest.pulls.get({ owner, repo, pull_number: pullNumber })).data;
            if (!requiredLabel || !actor || (requestedPrNumber > 0 && !automationLogin)) {
              core.setFailed('AI_CLI_REVIEW_REQUESTER_FORBIDDEN');
              return;
            }
            let requesterPermission;
            try {
              requesterPermission = (await github.rest.repos.getCollaboratorPermissionLevel({
                ...context.repo,
                username: actor,
              })).data;
            } catch (error) {
              core.setFailed(`AI_CLI_REVIEW_REQUESTER_PERMISSION_UNAVAILABLE:${error.status || 'unknown'}`);
              return;
            }
            const allowedRequesterRoles = new Set(['triage', 'write', 'maintain', 'admin']);
            const detailedPermissions = requesterPermission.user?.permissions || {};
            const hasAllowedRequesterPermission =
              ['triage', 'push', 'maintain', 'admin'].some(
                (permission) => detailedPermissions[permission] === true,
              ) ||
              allowedRequesterRoles.has(requesterPermission.role_name) ||
              ['write', 'admin'].includes(requesterPermission.permission);
            const isLabelRequest =
              requestedPrNumber === 0 &&
              context.payload.action === 'labeled' &&
              context.payload.label?.name === requiredLabel;
            const isReconciliationRequest =
              requestedPrNumber > 0 && actor === automationLogin;
            if (
              !hasAllowedRequesterPermission ||
              !(isLabelRequest || isReconciliationRequest)
            ) {
              core.setFailed('AI_CLI_REVIEW_REQUESTER_FORBIDDEN');
              return;
            }
            if (
              pr.state !== 'open' ||
              pr.draft === true ||
              pr.base.ref !== process.env.BASE_BRANCH ||
              pr.head.repo?.full_name !== `${owner}/${repo}` ||
              !/^[0-9a-f]{40}$/i.test(pr.base.sha) ||
              !/^[0-9a-f]{40}$/i.test(pr.head.sha)
            ) {
              core.setFailed('AI_CLI_REVIEW_SCOPE_FORBIDDEN');
              return;
            }
            if (!(pr.labels || []).some((label) => label.name === requiredLabel)) {
              core.setFailed('AI_CLI_REVIEW_FINAL_LABEL_REQUIRED');
              return;
            }
            if (context.payload.action === 'labeled' && context.payload.label?.name !== requiredLabel) {
              core.setFailed('AI_CLI_REVIEW_FINAL_LABEL_REQUIRED');
              return;
            }
            const headSha = pr.head.sha.toLowerCase();
            let baseSha;
            // A strict required-check rule evaluates GitHub's synthetic PR
            // merge commit, not merely the candidate head. Bind the second
            // Check run to that immutable merge preview only after proving it
            // has the exact base/head parents we are about to review. If the
            // base or head advances later, GitHub creates a new merge preview
            // without this receipt and blocks the merge until a new review.
            // GitHub rebuilds refs/pull/<n>/merge asynchronously after the
            // protected base advances. Busy repositories regularly need more
            // than the former 15-second window, even though the ref converges
            // to the correct exact base/head pair shortly afterwards. Keep the
            // validation fail-closed, but allow a bounded 90-second window for
            // that control-plane convergence.
            const mergeRefBackoffMilliseconds = [2_000, 4_000, 8_000, 16_000, 30_000, 30_000];
            const mergeRefMaxAttempts = mergeRefBackoffMilliseconds.length + 1;
            const safeMergeRefFailure = (error) => {
              const status = Number.isInteger(error?.status) ? String(error.status) : 'unknown';
              const code = typeof error?.code === 'string' && /^[A-Z0-9_]{1,80}$/.test(error.code)
                ? error.code
                : 'unknown';
              return `status=${status}:code=${code}`;
            };
            const mergeRefStartedAt = Date.now();
            let mergeSha;
            let mergeRefAttempts = 0;
            let lastMergeRefFailure = 'unknown';
            for (let attempt = 1; attempt <= mergeRefMaxAttempts; attempt += 1) {
              mergeRefAttempts = attempt;
              try {
                const livePr = (await github.rest.pulls.get({ owner, repo, pull_number: pr.number })).data;
                // PR base.sha is an asynchronously refreshed PR snapshot.
                // Resolve the protected branch itself for the review tuple.
                const baseRef = await github.rest.git.getRef({
                  owner, repo, ref: `heads/${process.env.BASE_BRANCH}`,
                });
                const liveBaseSha = baseRef.data.object?.sha?.toLowerCase();
                const liveHeadSha = livePr.head?.sha?.toLowerCase();
                if (
                  livePr.state !== 'open' ||
                  livePr.draft === true ||
                  livePr.base?.ref !== process.env.BASE_BRANCH ||
                  livePr.head?.repo?.full_name !== `${owner}/${repo}` ||
                  !/^[0-9a-f]{40}$/.test(liveBaseSha || '') ||
                  liveHeadSha !== headSha ||
                  !(livePr.labels || []).some((label) => label.name === requiredLabel)
                ) {
                  core.setFailed(`AI_CLI_REVIEW_MERGE_REF_CONTEXT_CHANGED:attempt=${attempt}`);
                  return;
                }
                const mergeRef = await github.rest.git.getRef({
                  owner,
                  repo,
                  ref: `pull/${pr.number}/merge`,
                });
                const candidateMergeSha = mergeRef.data.object?.sha?.toLowerCase();
                if (!/^[0-9a-f]{40}$/.test(candidateMergeSha || '')) {
                  const error = new Error('synthetic merge ref did not resolve to a full SHA');
                  error.code = 'MERGE_REF_SHA_INVALID';
                  throw error;
                }
                const mergeCommit = await github.rest.repos.getCommit({
                  owner,
                  repo,
                  ref: candidateMergeSha,
                });
                const parents = (mergeCommit.data.parents || []).map((parent) => parent.sha?.toLowerCase());
                const mergeTreeSha = mergeCommit.data.commit?.tree?.sha?.toLowerCase();
                if (parents.length !== 2 || parents[0] !== liveBaseSha || parents[1] !== headSha) {
                  const error = new Error('synthetic merge ref parents did not match the live PR');
                  error.code = 'MERGE_REF_PARENTS_INVALID';
                  throw error;
                }
                if (!/^[0-9a-f]{40}$/.test(mergeTreeSha || '')) {
                  const error = new Error('synthetic merge tree did not resolve to a full SHA');
                  error.code = 'MERGE_TREE_SHA_INVALID';
                  throw error;
                }
                const baseReadback = await github.rest.git.getRef({
                  owner, repo, ref: `heads/${process.env.BASE_BRANCH}`,
                });
                if (baseReadback.data.object?.sha?.toLowerCase() !== liveBaseSha) {
                  const error = new Error('protected base advanced during merge preview validation');
                  error.code = 'MERGE_REF_BASE_CHANGED';
                  throw error;
                }
                baseSha = liveBaseSha;
                mergeSha = candidateMergeSha;
                core.setOutput('merge_tree_sha', mergeTreeSha);
                break;
              } catch (error) {
                lastMergeRefFailure = safeMergeRefFailure(error);
                if (error?.status === 403 || error?.status === 429) {
                  core.setFailed(`AI_CLI_REVIEW_MERGE_REF_API_UNAVAILABLE:${lastMergeRefFailure}`);
                  return;
                }
                const waitingMilliseconds = attempt < mergeRefMaxAttempts
                  ? mergeRefBackoffMilliseconds[attempt - 1]
                  : 0;
                core.notice(`AI_CLI_REVIEW_MERGE_REF_WAIT:attempt=${attempt}/${mergeRefMaxAttempts}:wait_ms=${waitingMilliseconds}:${lastMergeRefFailure}`);
                if (waitingMilliseconds > 0) {
                  await new Promise((resolve) => setTimeout(resolve, waitingMilliseconds));
                }
              }
            }
            const mergeRefWaitMilliseconds = Date.now() - mergeRefStartedAt;
            if (!mergeSha) {
              core.setFailed(`AI_CLI_REVIEW_MERGE_REF_UNAVAILABLE:attempts=${mergeRefAttempts}:wait_ms=${mergeRefWaitMilliseconds}:${lastMergeRefFailure}`);
              return;
            }
            const runAttempt = process.env.REVIEW_RUN_ATTEMPT;
            if (!/^[1-9][0-9]*$/.test(runAttempt || '')) {
              core.setFailed('AI_CLI_REVIEW_RUN_ATTEMPT_INVALID');
              return;
            }
            const requestId = `cli-${context.runId}-${runAttempt}-${pr.number}-${headSha.slice(0, 12)}`;
            core.setOutput('head_sha', headSha);
            core.setOutput('base_sha', baseSha);
            core.setOutput('merge_sha', mergeSha);
            core.setOutput('merge_ref_attempts', String(mergeRefAttempts));
            core.setOutput('merge_ref_wait_ms', String(mergeRefWaitMilliseconds));
            core.setOutput('pr_number', String(pr.number));
            core.setOutput('request_id', requestId);

      - name: Check out verified merge-preview snapshot without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          # The context step proved this synthetic commit has the current
          # base and candidate-head parents. Review the actual merge result,
          # rather than publishing a candidate-only receipt to this SHA.
          ref: ${{ steps.context.outputs.merge_sha }}
          # Fetch history while checkout holds its short-lived repository token.
          # That action removes the token before the untrusted snapshot is read.
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - id: input
        name: Create immutable local review input
        env:
          BASE_SHA: ${{ steps.context.outputs.base_sha }}
          HEAD_SHA: ${{ steps.context.outputs.head_sha }}
          MERGE_SHA: ${{ steps.context.outputs.merge_sha }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          REQUEST_ID: ${{ steps.context.outputs.request_id }}
          REPOSITORY: ${{ github.repository }}
          REVIEW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          umask 027
          test "$(id -un)" = 'reviewreceipt'
          case "$REQUEST_ID" in
            cli-[0-9]*-[0-9]*-[0-9]*-[0-9a-f]*) ;;
            *) echo 'AI_CLI_REVIEW_REQUEST_INVALID' >&2; exit 1 ;;
          esac
          input_parent=/var/lib/codex-review-bridge/incoming
          temporary="$input_parent/.${REQUEST_ID}.tmp"
          target="$input_parent/$REQUEST_ID"
          test ! -e "$temporary"
          test ! -e "$target"
          mkdir "$temporary"
          trap 'rm -rf -- "$temporary"' EXIT
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          test -n "$merge_base"
          test "$merge_base" = "$(git rev-parse "$merge_base")"
          git merge-base --is-ancestor "$merge_base" "$BASE_SHA"
          git merge-base --is-ancestor "$merge_base" "$HEAD_SHA"
          export MERGE_BASE_SHA="$merge_base"
          printf 'merge_base_sha=%s\n' "$merge_base" >> "$GITHUB_OUTPUT"
          # ``MERGE_SHA`` is a verified base/head merge preview. The model
          # receives the exact changes this strict-gate Check would merge and
          # a full snapshot of that resulting tree.
          git diff --no-ext-diff --no-textconv --binary "$BASE_SHA" "$MERGE_SHA" -- > "$temporary/diff.patch"
          source_root="$temporary/source"
          mkdir -- "$source_root"
          # Do not use git archive: it honors export-ignore and could omit a
          # tracked file from the isolated review snapshot.
          source_tree="$temporary/source-tree.tar"
          git ls-files -z | tar --create --no-recursion --verbatim-files-from --null --files-from=- --file="$source_tree"
          tar --extract --no-same-owner --no-same-permissions --file="$source_tree" -C "$source_root"
          rm -f -- "$source_tree"
          # The isolated agent rejects symlinks too. Reject them before marker
          # creation so a candidate-controlled path can never escape the
          # temporary snapshot tree.
          if test -n "$(find "$source_root" -type l -print -quit)"; then
            echo "candidate snapshot contains symlink" >&2
            exit 1
          fi
          # Deleted paths intentionally have no placeholder inside the merged
          # source tree. Their complete prior content and deletion are retained
          # in diff.patch, avoiding file-to-directory marker collisions.
          (
            cd "$source_root"
            find . -type f -print0 | tar --create --no-recursion --verbatim-files-from --null --files-from=- --gzip --file="$temporary/source.tar.gz"
          )
          git diff --no-ext-diff --no-textconv --name-only -z "$BASE_SHA" "$MERGE_SHA" -- > "$temporary/changed-files.z"
          # Node is supplied by the pinned GitHub actions. It avoids shell JSON
          # interpolation and binds the review contract to the exact diff.
          node - "$temporary/changed-files.z" "$temporary/request.json" <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const [changedFilesPath, requestPath] = process.argv.slice(2);
          const changedFiles = fs.readFileSync(changedFilesPath).toString('utf8').split('\0').filter(Boolean);
          if (new Set(changedFiles).size !== changedFiles.length) {
            throw new Error('AI_CLI_REVIEW_CHANGED_FILES_INVALID');
          }
          const cancelSubjectDigest = crypto.randomBytes(32).toString('hex');
          const cancelAttemptNumber = Number(process.env.REVIEW_RUN_ATTEMPT);
          if (!Number.isSafeInteger(cancelAttemptNumber) || cancelAttemptNumber < 1) {
            throw new Error('AI_CLI_REVIEW_CANCEL_ATTEMPT_INVALID');
          }
          const request = {
            request_id: process.env.REQUEST_ID,
            repository: process.env.REPOSITORY,
            pr_number: Number(process.env.PR_NUMBER),
            head_sha: process.env.HEAD_SHA,
            base_sha: process.env.BASE_SHA,
            merge_base_sha: process.env.MERGE_BASE_SHA,
            merge_sha: process.env.MERGE_SHA,
            changed_files: changedFiles,
            cancel_binding: {
              schema: 'code-review-cancel-binding/v1',
              subject_digest: cancelSubjectDigest,
              lease_generation: 1,
              attempt_number: cancelAttemptNumber,
            },
          };
          fs.writeFileSync(requestPath, `${JSON.stringify(request)}\n`, { mode: 0o640 });
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `cancel_subject_digest=${cancelSubjectDigest}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `cancel_attempt_number=${cancelAttemptNumber}\n`);
          NODE
          rm -f -- "$temporary/changed-files.z"
          chmod 0640 "$temporary/diff.patch" "$temporary/source.tar.gz" "$temporary/request.json"
          mv "$temporary" "$target"
          trap - EXIT

      - id: receipt
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          HEAD_SHA: ${{ steps.context.outputs.head_sha }}
          MERGE_SHA: ${{ steps.context.outputs.merge_sha }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          REQUEST_ID: ${{ steps.context.outputs.request_id }}
        with:
          # Do not enable github-script request-level retries here. GitHub does
          # not make checks.create idempotent by external_id, so an ambiguous
          # create response could produce duplicate Check runs before this
          # script has another chance to re-query the fixed identity. A
          # transport error therefore fails closed; a new protected-main
          # dispatch re-runs the lookup before it can create anything.
          script: |
            const output = {
              title: 'Codex CLI review pending',
              summary: `Shadow CLI review requested for ${process.env.HEAD_SHA}; receipt binds reviewed merge ${process.env.MERGE_SHA}.`,
              text: JSON.stringify({
                schema_version: '1.0',
                mode: 'shadow',
                request_id: process.env.REQUEST_ID,
                head_sha: process.env.HEAD_SHA,
                merge_sha: process.env.MERGE_SHA,
                status: 'pending',
              }, null, 2),
            };
            const headExternalId = `ai-cli-review:${process.env.PR_NUMBER}:${process.env.HEAD_SHA}`;
            const existingChecks = await github.paginate(
              github.rest.checks.listForRef,
              { ...context.repo, ref: process.env.HEAD_SHA, per_page: 100, filter: 'all' },
            );
            const newestActiveGeneration = (checks, prefixes) => checks
              .filter((check) =>
                check.name === 'ai-review/receipt' &&
                check.status !== 'completed' &&
                prefixes.some((prefix) => check.external_id?.startsWith(prefix)),
              )
              .sort((left, right) => Number(right.id || 0) - Number(left.id || 0))[0] || null;
            const invalidationPrefix = `ai-review-invalidated:${process.env.PR_NUMBER}:${process.env.HEAD_SHA}:`;
            // Completed Check runs cannot return to an active state.  A
            // terminal invalidation remains fail-closed audit evidence; a
            // newly authorized exact-head review creates a distinct receipt
            // generation, exactly like an ordinary GitHub check re-run.
            // Only a non-terminal generation may be resumed after an
            // interrupted protected-main workflow.
            const activeInvalidation = newestActiveGeneration(existingChecks, [invalidationPrefix]);
            const existingHead = newestActiveGeneration(existingChecks, [headExternalId]);
            const reusableHead = activeInvalidation || existingHead;
            const generationStartedAt = Date.now();
            const headGenerationExternalId = `${headExternalId}:run:${context.runId}:${generationStartedAt}`;
            const headCheck = reusableHead
              ? await github.rest.checks.update({
                  ...context.repo,
                   check_run_id: reusableHead.id,
                   status: 'in_progress',
                   external_id: headGenerationExternalId,
                   output,
                })
              : await github.rest.checks.create({
                  ...context.repo,
                  name: 'ai-review/receipt',
                  head_sha: process.env.HEAD_SHA,
                  status: 'in_progress',
                  external_id: headGenerationExternalId,
                  output,
                });
            core.setOutput('head_check_run_id', String(headCheck.data.id));

      - name: Remove submitted snapshot after failed preparation
        if: (failure() || cancelled()) && steps.context.outputs.request_id != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          REQUEST_ID: ${{ steps.context.outputs.request_id }}
          CANCEL_SUBJECT_DIGEST: ${{ steps.input.outputs.cancel_subject_digest }}
          CANCEL_ATTEMPT_NUMBER: ${{ steps.input.outputs.cancel_attempt_number }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');
            // Submission can precede preparation failure or cancellation. The
            // verifier job may never start, so terminalize here as well before
            // removing input; a claimed producer can still publish afterwards.
            const requestId = process.env.REQUEST_ID || '';
            if (!/^cli-[0-9]+-[0-9]+-[0-9]+-[0-9a-f]+$/.test(requestId)) {
              core.setFailed('AI_CLI_REVIEW_TERMINAL_REQUEST_INVALID');
              return;
            }
            const digest = process.env.CANCEL_SUBJECT_DIGEST || '';
            const attempt = Number(process.env.CANCEL_ATTEMPT_NUMBER);
            if (!/^[0-9a-f]{64}$/.test(digest) || !Number.isSafeInteger(attempt) || attempt < 1) {
              core.setFailed('AI_CLI_REVIEW_CANCEL_BINDING_INVALID');
              return;
            }
            const cancelIncoming = '/var/lib/codex-review-bridge/cancel-incoming';
            const cancelAcks = '/var/lib/codex-review-bridge/cancel-acks';
            const sequence = 1;
            const command = {
              schema_version: '2.0', request_id: requestId, cancel_sequence: sequence,
              reason: 'expired', created_at: new Date().toISOString(),
              subject_digest: digest, lease_generation: 1, attempt_number: attempt,
            };
            const cancelTarget = path.join(cancelIncoming, `${requestId}.${sequence}.json`);
            const cancelTemporary = path.join(cancelIncoming, `.${requestId}.${sequence}.${process.pid}.tmp`);
            fs.writeFileSync(cancelTemporary, `${JSON.stringify(command)}\n`, { flag: 'wx', mode: 0o600 });
            const temporaryFd = fs.openSync(cancelTemporary, 'r');
            try { fs.fsyncSync(temporaryFd); } finally { fs.closeSync(temporaryFd); }
            try { fs.linkSync(cancelTemporary, cancelTarget); } catch (error) {
              if (error.code !== 'EEXIST') throw error;
            } finally {
              fs.rmSync(cancelTemporary);
            }
            const cancelDirectoryFd = fs.openSync(cancelIncoming, 'r');
            try { fs.fsyncSync(cancelDirectoryFd); } finally { fs.closeSync(cancelDirectoryFd); }
            const ackPath = path.join(cancelAcks, `${requestId}.${sequence}.json`);
            const cancelDeadline = Date.now() + 60 * 1000;
            let resolution = null;
            while (Date.now() < cancelDeadline) {
              if (fs.existsSync(ackPath)) {
                resolution = JSON.parse(fs.readFileSync(ackPath, 'utf8'));
                break;
              }
              await new Promise((resolve) => setTimeout(resolve, 1000));
            }
            if (!resolution || resolution.request_id !== requestId ||
                resolution.cancel_sequence !== sequence ||
                !['ACCEPTED', 'OBSOLETE_AFTER_TERMINAL'].includes(resolution.state)) {
              core.setFailed('AI_CLI_REVIEW_CANCEL_NOT_ACCEPTED');
              return;
            }
            core.info(`AI_CLI_REVIEW_CANCEL_${resolution.state}`);
            const ready = '/var/lib/codex-review-bridge/outgoing/ready';
            const marker = path.join(ready, `${requestId}.terminal`);
            try {
              const fd = fs.openSync(marker, 'wx', 0o600);
              try { fs.fsyncSync(fd); } finally { fs.closeSync(fd); }
            } catch (error) {
              if (error.code !== 'EEXIST') throw error;
              const metadata = fs.lstatSync(marker);
              if (!metadata.isFile() || metadata.nlink !== 1 || metadata.size !== 0 ||
                  metadata.uid !== process.getuid() || (metadata.mode & 0o777) !== 0o600) {
                throw new Error('AI_CLI_REVIEW_TERMINAL_MARKER_INVALID');
              }
            }
            const directoryFd = fs.openSync(ready, 'r');
            try { fs.fsyncSync(directoryFd); } finally { fs.closeSync(directoryFd); }
            const root = path.resolve('/var/lib/codex-review-bridge/incoming');
            const target = path.resolve(root, process.env.REQUEST_ID);
            if (!target.startsWith(`${root}${path.sep}`)) {
              core.setFailed('AI_CLI_REVIEW_PREPARE_CLEANUP_PATH_INVALID');
              return;
            }
            fs.rmSync(target, { recursive: true, force: true });

  await-cli-review:
    name: Verify isolated CLI review
    needs: prepare-cli-review
    outputs:
      receipt_step_outcome: ${{ steps.receipt.outcome }}
      receipt_protocol: ${{ steps.receipt.outputs.receipt_protocol }}
