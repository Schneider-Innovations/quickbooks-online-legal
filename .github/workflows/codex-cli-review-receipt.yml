              diagnostic.inconclusive_batches.length <= 32 &&
              diagnostic.inconclusive_batches.every((batch) =>
                Number.isSafeInteger(batch?.batch_number) && batch.batch_number > 0 &&
                Number.isSafeInteger(batch?.reviewed_path_count) && batch.reviewed_path_count >= 0 &&
