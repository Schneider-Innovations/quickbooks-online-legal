              typeof receipt.failure_class === 'string' && bridgeFailureClasses.has(receipt.failure_class)
              ? receipt.failure_class
              : null;
            const suppliedSignals = receipt?.reason_code === 'model_unavailable' &&
              typeof receipt.failure_signals === 'string' && receipt.failure_signals !== 'none'
              ? receipt.failure_signals.split(',')
              : [];
            const suppliedSignalsValid = receipt?.reason_code === 'model_unavailable' &&
              typeof receipt.failure_signals === 'string' && (
                receipt.failure_signals === 'none' || (
                  suppliedSignals.length > 0 && suppliedSignals.length <= 6 &&
                  suppliedSignals.every((signal, index) =>
                    bridgeFailureSignals.has(signal) && suppliedSignals.indexOf(signal) === index)
                )
              );
            const bridge_failure_signals = suppliedSignalsValid && suppliedSignals.length > 0
              ? suppliedSignals
              : [];
            const bridge_retry_after_seconds = receipt?.reason_code === 'model_unavailable' &&
              Number.isInteger(receipt.retry_after_seconds) &&
              receipt.retry_after_seconds >= 1 && receipt.retry_after_seconds <= 900
              ? receipt.retry_after_seconds
              : null;
            const contextFailureStages = new Set([
              'inline_file_bytes',
              'inline_context_bytes',
              'javascript_outline_bytes',
              'python_outline_bytes',
              'model_stdin_bytes',
              'reconciliation_context_bytes',
              'reconciliation_stdin_bytes',
              'full_coverage_source_bytes',
              'full_coverage_source_lines',
              'full_coverage_diff_bytes',
              'full_coverage_diff_lines',
            ]);
            const contextFailureSupplied = receipt && Object.hasOwn(receipt, 'failure');
            const suppliedContextFailure = receipt?.reason_code === 'review_context_too_large' &&
              receipt.failure && typeof receipt.failure === 'object' && !Array.isArray(receipt.failure) &&
              Object.keys(receipt.failure).sort().join(',') === 'actual_bytes,failure_stage,limit_bytes' &&
              contextFailureStages.has(receipt.failure.failure_stage) &&
              Number.isSafeInteger(receipt.failure.actual_bytes) &&
              Number.isSafeInteger(receipt.failure.limit_bytes) &&
              receipt.failure.actual_bytes > receipt.failure.limit_bytes &&
              receipt.failure.limit_bytes > 0
