              await github.rest.checks.create({
                ...context.repo,
                name,
                head_sha: expectedHead,
                status: 'completed',
                conclusion: gateConclusion,
                completed_at: new Date().toISOString(),
                external_id: `${name}:${process.env.PR_NUMBER}:${expectedHead}:${expectedMerge}:${context.runId}:head`,
                output: gateOutput,
              });
            };
            await publishSplitGate(
              'ai-review/execution', executionSucceeded ? 'success' : 'failure', executionOutput,
            );
            await publishSplitGate(
              'ai-review/verdict', verdictPassed ? 'success' : 'failure', verdictOutput,
            );
