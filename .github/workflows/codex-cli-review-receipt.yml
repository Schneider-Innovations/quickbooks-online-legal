name: Codex CLI review receipt

on:
  workflow_call:
    inputs:
      pr_number:
        description: Optional PR number for a protected-main reconciliation run.
        required: false
        type: number
        default: 0
      base_branch:
        description: Protected base branch expected for every reviewed PR.
        required: false
        type: string
        default: main

# This workflow is only called by the base-owned pull_request_target caller in
# this repository. It checks out a same-repository PR snapshot but never runs
# its code. The Actions token is not passed to the Codex service account.
permissions:
  checks: write
  contents: read
  pull-requests: read

jobs:
  prepare-cli-review:
    name: Prepare isolated CLI review
    runs-on:
      group: code-review
      labels: [self-hosted, code-review, cli-review, shadow-only]
    timeout-minutes: 6
    outputs:
      base_sha: ${{ steps.context.outputs.base_sha }}
      head_sha: ${{ steps.context.outputs.head_sha }}
      merge_base_sha: ${{ steps.input.outputs.merge_base_sha }}
      pr_number: ${{ steps.context.outputs.pr_number }}
      request_id: ${{ steps.context.outputs.request_id }}
      check_run_id: ${{ steps.receipt.outputs.check_run_id }}
    steps:
      - id: context
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          BASE_BRANCH: ${{ inputs.base_branch }}
        with:
          script: |
            const requestedPrNumber = Number(process.env.PR_NUMBER);
            const pr = context.payload.pull_request || (
              requestedPrNumber > 0
                ? (await github.rest.pulls.get({ ...context.repo, pull_number: requestedPrNumber })).data
                : null
            );
            if (!pr) {
              core.setFailed('AI_CLI_REVIEW_PR_CONTEXT_REQUIRED');
              return;
            }
            const { owner, repo } = context.repo;
            if (
              pr.state !== 'open' ||
              pr.draft === true ||
              pr.base.ref !== process.env.BASE_BRANCH ||
              pr.head.repo?.full_name !== `${owner}/${repo}` ||
              !/^[0-9a-f]{40}$/i.test(pr.base.sha) ||
              !/^[0-9a-f]{40}$/i.test(pr.head.sha)
            ) {
              core.setFailed('AI_CLI_REVIEW_SCOPE_FORBIDDEN');
              return;
            }
            const headSha = pr.head.sha.toLowerCase();
            const baseSha = pr.base.sha.toLowerCase();
            const requestId = `cli-${context.runId}-${process.env.GITHUB_RUN_ATTEMPT || '1'}-${pr.number}-${headSha.slice(0, 12)}`;
            core.setOutput('head_sha', headSha);
            core.setOutput('base_sha', baseSha);
            core.setOutput('pr_number', String(pr.number));
            core.setOutput('request_id', requestId);

      - name: Check out exact candidate snapshot without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ steps.context.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - id: input
        name: Create immutable local review input
        env:
          BASE_SHA: ${{ steps.context.outputs.base_sha }}
          HEAD_SHA: ${{ steps.context.outputs.head_sha }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          REQUEST_ID: ${{ steps.context.outputs.request_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          umask 027
          test "$(id -un)" = 'reviewreceipt'
          case "$REQUEST_ID" in
            cli-[0-9]*-[0-9]*-[0-9]*-[0-9a-f]*) ;;
            *) echo 'AI_CLI_REVIEW_REQUEST_INVALID' >&2; exit 1 ;;
          esac
          input_parent=/var/lib/codex-review-bridge/incoming
          temporary="$input_parent/.${REQUEST_ID}.tmp"
          target="$input_parent/$REQUEST_ID"
          test ! -e "$temporary"
          test ! -e "$target"
          mkdir "$temporary"
          trap 'rm -rf -- "$temporary"' EXIT
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          test -n "$merge_base"
          test "$merge_base" = "$(git rev-parse "$merge_base")"
          git merge-base --is-ancestor "$merge_base" "$BASE_SHA"
          git merge-base --is-ancestor "$merge_base" "$HEAD_SHA"
          export MERGE_BASE_SHA="$merge_base"
          printf 'merge_base_sha=%s\n' "$merge_base" >> "$GITHUB_OUTPUT"
          git diff --no-ext-diff --binary "$merge_base" "$HEAD_SHA" -- > "$temporary/diff.patch"
          git ls-files -z | tar --create --no-recursion --verbatim-files-from --null --files-from=- --gzip --file="$temporary/source.tar.gz"
          git diff --no-ext-diff --name-only -z "$merge_base" "$HEAD_SHA" -- > "$temporary/changed-files.z"
          node - "$temporary/changed-files.z" "$temporary/request.json" <<'NODE'
          const fs = require('fs');
          const [changedFilesPath, requestPath] = process.argv.slice(2);
          const changedFiles = fs.readFileSync(changedFilesPath).toString('utf8').split('\0').filter(Boolean);
          if (!changedFiles.length || new Set(changedFiles).size !== changedFiles.length) {
            throw new Error('AI_CLI_REVIEW_CHANGED_FILES_INVALID');
          }
          const request = {
            request_id: process.env.REQUEST_ID,
            repository: process.env.REPOSITORY,
            pr_number: Number(process.env.PR_NUMBER),
            head_sha: process.env.HEAD_SHA,
            base_sha: process.env.BASE_SHA,
            merge_base_sha: process.env.MERGE_BASE_SHA,
            changed_files: changedFiles,
          };
          fs.writeFileSync(requestPath, `${JSON.stringify(request)}\n`, { mode: 0o640 });
          NODE
          rm -f -- "$temporary/changed-files.z"
          chmod 0640 "$temporary/diff.patch" "$temporary/source.tar.gz" "$temporary/request.json"
          mv "$temporary" "$target"
          trap - EXIT

      - id: receipt
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          HEAD_SHA: ${{ steps.context.outputs.head_sha }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          REQUEST_ID: ${{ steps.context.outputs.request_id }}
        with:
          script: |
            const check = await github.rest.checks.create({
              ...context.repo,
              name: 'ai-review/receipt',
              head_sha: process.env.HEAD_SHA,
              status: 'in_progress',
              external_id: `ai-cli-review:${process.env.PR_NUMBER}:${process.env.HEAD_SHA}`,
              output: {
                title: 'Codex CLI review pending',
                summary: `Shadow CLI review requested for ${process.env.HEAD_SHA}.`,
                text: JSON.stringify({
                  schema_version: '1.0', mode: 'shadow', request_id: process.env.REQUEST_ID,
                  head_sha: process.env.HEAD_SHA, status: 'pending',
                }, null, 2),
              },
            });
            core.setOutput('check_run_id', String(check.data.id));

      - name: Remove submitted snapshot after failed preparation
        if: (failure() || cancelled()) && steps.context.outputs.request_id != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          REQUEST_ID: ${{ steps.context.outputs.request_id }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const root = path.resolve('/var/lib/codex-review-bridge/incoming');
            const target = path.resolve(root, process.env.REQUEST_ID);
            if (!target.startsWith(`${root}${path.sep}`)) {
              core.setFailed('AI_CLI_REVIEW_PREPARE_CLEANUP_PATH_INVALID');
              return;
            }
            fs.rmSync(target, { recursive: true, force: true });

  await-cli-review:
    name: Verify isolated CLI review
    needs: prepare-cli-review
    runs-on:
      group: code-review
      labels: [self-hosted, code-review, cli-review, shadow-only]
    timeout-minutes: 14
    steps:
      - id: receipt
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          CHECK_RUN_ID: ${{ needs.prepare-cli-review.outputs.check_run_id }}
          HEAD_SHA: ${{ needs.prepare-cli-review.outputs.head_sha }}
          BASE_SHA: ${{ needs.prepare-cli-review.outputs.base_sha }}
          MERGE_BASE_SHA: ${{ needs.prepare-cli-review.outputs.merge_base_sha }}
          PR_NUMBER: ${{ needs.prepare-cli-review.outputs.pr_number }}
          REQUEST_ID: ${{ needs.prepare-cli-review.outputs.request_id }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const requestId = process.env.REQUEST_ID;
            const resultRoot = path.resolve('/var/lib/codex-review-bridge/outgoing');
            const resultPath = path.resolve(resultRoot, `${requestId}.json`);
            if (!resultPath.startsWith(`${resultRoot}${path.sep}`)) {
              core.setFailed('AI_CLI_REVIEW_RESULT_PATH_INVALID');
              return;
            }
            const deadline = Date.now() + 660 * 1000;
            let receipt = null;
            while (Date.now() < deadline) {
              if (fs.existsSync(resultPath)) {
                const bytes = fs.readFileSync(resultPath);
                if (bytes.length <= 64 * 1024) {
                  try { receipt = JSON.parse(bytes.toString('utf8')); } catch { receipt = null; }
                }
                break;
              }
              await new Promise((resolve) => setTimeout(resolve, 10 * 1000));
            }
            const expectedHead = process.env.HEAD_SHA;
            const expectedBase = process.env.BASE_SHA;
            const expectedMergeBase = process.env.MERGE_BASE_SHA;
            const expectedPolicyDigest = 'da487b1651657e1bf6e0c45642d51f166ce073cdc81527fd361446255b05a469';
            const changed = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo, pull_number: Number(process.env.PR_NUMBER), per_page: 100,
            });
            const expectedChangedFiles = changed.map((file) => file.filename).sort();
            const isStringArray = (value) => Array.isArray(value) && value.every((item) => typeof item === 'string' && item.length > 0 && item.length <= 512);
            const sameSortedStrings = (value, expected) => isStringArray(value) && [...value].sort().every((item, index) => item === expected[index]) && value.length === expected.length;
            const validOmissions = (value, reviewed) => Array.isArray(value) && value.every((item) => item && typeof item === 'object' && Object.keys(item).length === 2 && typeof item.path === 'string' && expectedChangedFiles.includes(item.path) && !reviewed.includes(item.path) && typeof item.reason === 'string' && item.reason.length > 0 && item.reason.length <= 240);
            const validFindings = (value) => Array.isArray(value) && value.length <= 25 && value.every((item) => item && typeof item === 'object' && Object.keys(item).length === 5 && ['severity', 'path', 'line', 'title', 'explanation'].every((key) => Object.hasOwn(item, key)) && ['critical', 'high', 'medium', 'low'].includes(item.severity) && typeof item.path === 'string' && expectedChangedFiles.includes(item.path) && Number.isInteger(item.line) && item.line > 0 && item.line <= 1_000_000 && typeof item.title === 'string' && item.title.length > 0 && item.title.length <= 240 && typeof item.explanation === 'string' && item.explanation.length > 0 && item.explanation.length <= 2000);
            const coverageComplete = receipt && sameSortedStrings(receipt.changed_files, expectedChangedFiles) && sameSortedStrings(receipt.reviewed_files, expectedChangedFiles) && Array.isArray(receipt.omitted_files) && receipt.omitted_files.length === 0;
            const valid = receipt &&
              receipt.schema_version === '1.0' && receipt.request_id === requestId && receipt.pr_number === Number(process.env.PR_NUMBER) && receipt.head_sha === expectedHead && receipt.base_sha === expectedBase && receipt.merge_base_sha === expectedMergeBase && receipt.status === 'completed' && ['PASS', 'BLOCK', 'INCONCLUSIVE'].includes(receipt.decision) && typeof receipt.summary === 'string' && receipt.summary.length > 0 && receipt.summary.length <= 2000 && typeof receipt.analysis_complete === 'boolean' && isStringArray(receipt.changed_files) && isStringArray(receipt.reviewed_files) && validOmissions(receipt.omitted_files, receipt.reviewed_files) && validFindings(receipt.findings) && receipt.policy_digest === expectedPolicyDigest && typeof receipt.runtime === 'object' && receipt.runtime !== null && Object.keys(receipt.runtime).length === 2 && Object.hasOwn(receipt.runtime, 'harness') && Object.hasOwn(receipt.runtime, 'version') && typeof receipt.runtime.harness === 'string' && receipt.runtime.harness.length > 0 && typeof receipt.runtime.version === 'string' && receipt.runtime.version.length > 0;
            const clear = valid && receipt.decision === 'PASS' && receipt.analysis_complete === true && coverageComplete && receipt.findings.length === 0;
            let conclusion = clear ? 'success' : 'failure';
            let reason = !receipt ? 'result_missing_or_malformed' : !valid ? 'result_contract_invalid' : !clear && receipt.decision === 'PASS' ? 'review_coverage_incomplete' : `decision_${receipt.decision.toLowerCase()}`;
            let output = valid ? receipt : {
              schema_version: '1.0', mode: 'shadow', request_id: requestId,
              head_sha: expectedHead, status: 'unavailable', reason_code: reason,
            };
            let receiptText = JSON.stringify(output);
            if (valid && (receiptText.length > 60_000 || Buffer.byteLength(receiptText, 'utf8') > 60_000)) {
              conclusion = 'failure'; reason = 'result_too_large';
              output = { schema_version: '1.0', mode: 'shadow', request_id: requestId,
                head_sha: expectedHead, status: 'unavailable', reason_code: reason };
              receiptText = JSON.stringify(output);
            }
            await github.rest.checks.update({
              ...context.repo, check_run_id: Number(process.env.CHECK_RUN_ID), status: 'completed',
              conclusion, completed_at: new Date().toISOString(),
              output: {
                title: conclusion === 'success' ? 'Codex CLI reviewed current head' : 'Codex CLI review receipt not ready',
                summary: conclusion === 'success' ? output.summary : `Fail-closed Shadow result: ${reason}.`,
                text: receiptText,
              },
            });
            if (conclusion !== 'success') core.setFailed(`AI_CLI_REVIEW_NOT_READY:${reason}`);

      - name: Remove submitted snapshot
        if: always()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          REQUEST_ID: ${{ needs.prepare-cli-review.outputs.request_id }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const root = path.resolve('/var/lib/codex-review-bridge/incoming');
            const target = path.resolve(root, process.env.REQUEST_ID);
            if (!target.startsWith(`${root}${path.sep}`)) {
              core.setFailed('AI_CLI_REVIEW_CLEANUP_PATH_INVALID');
              return;
            }
            fs.rmSync(target, { recursive: true, force: true });

