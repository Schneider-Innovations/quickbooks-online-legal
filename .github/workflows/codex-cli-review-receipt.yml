            // Execution answers whether a trustworthy review result exists;
            // verdict answers what that result decided. Infrastructure failure
            // never becomes an INCONCLUSIVE code-review decision.
            const executionSucceeded = output.result_kind === 'review_result';
            const executionOutput = {
              title: executionSucceeded
                ? 'AI review execution succeeded'
                : 'AI review execution failed',
              summary: executionSucceeded
                ? 'A schema-valid, exact-head review result was produced.'
                : `No review verdict was produced: ${reason}.`,
              text: JSON.stringify({
                schema_version: '2.0',
                request_id: requestId,
                head_sha: expectedHead,
                merge_sha: expectedMerge,
                ...output.execution,
              }),
            };
            const verdictPassed = executionSucceeded && clear;
            const verdictOutput = {
              title: !executionSucceeded
                ? 'AI review verdict not produced'
                : verdictPassed
                  ? 'AI review verdict passed'
                  : 'AI review verdict blocked',
              summary: !executionSucceeded
                ? 'Execution failed before a trustworthy code verdict existed.'
                : verdictPassed
                  ? 'The exact-head review satisfied the severity and coverage policy.'
                  : `The exact-head review did not satisfy the verdict gate: ${reason}.` +
