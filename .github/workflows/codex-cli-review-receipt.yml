                id: publishedHeadCheck?.id,
                name: publishedHeadCheck?.name,
                app: { id: publishedHeadCheck?.app?.id },
                status: publishedHeadCheck?.status,
                conclusion: publishedHeadCheck?.conclusion,
                head_sha: publishedHeadCheck?.head_sha,
                started_at: publishedHeadCheck?.started_at,
                completed_at: publishedHeadCheck?.completed_at,
                html_url: publishedHeadCheck?.html_url,
                external_id: publishedHeadCheck?.external_id,
                output: { summary: publishedHeadCheck?.output?.summary },
