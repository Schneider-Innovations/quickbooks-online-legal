              await github.rest.checks.update({
                ...context.repo,
                check_run_id: Number(process.env.HEAD_CHECK_RUN_ID),
                status: 'completed', conclusion: 'failure', completed_at: new Date().toISOString(),
                output: {
                  title: 'Codex CLI review receipt archive unavailable',
                  summary: 'Fail-closed: the exact terminal receipt could not be durably archived.',
                },
              });
