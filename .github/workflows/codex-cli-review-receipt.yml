              text: JSON.stringify({
                schema_version: '2.0',
                request_id: requestId,
                head_sha: expectedHead,
                merge_sha: expectedMerge,
                base_sha: output.base_sha || null,
                workflow_run_id: context.runId,
                workflow_run_attempt: reviewRunAttempt,
                original_receipt_check_run_id: originalReceiptUrl ? originalCheckId : null,
                original_receipt_url: originalReceiptUrl,
                inconclusive_explanation: inconclusiveExplanation,
                inconclusive_explanation_code: inconclusiveExplanation
