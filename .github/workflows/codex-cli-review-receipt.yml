              .filter((finding) => changedStatusByPath.get(finding.path) !== 'removed')
              .map((finding) => {
                const disposition = blockingFinding(finding) ? 'blocking' : 'deferred';
                return {
                  path: finding.path,
                  start_line: finding.line,
                  end_line: finding.line,
                  annotation_level: disposition === 'blocking' ? 'failure' : 'warning',
                  title: `[${finding.severity.toUpperCase()}] ${finding.title}`,
                  message: finding.explanation,
                  raw_details: `Receipt severity: ${finding.severity}; disposition: ${disposition}.`,
