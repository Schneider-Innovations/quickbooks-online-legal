            const diagnosticEnvelopeValid = executionFailureEnvelope &&
              receipt.schema_version === '1.0' &&
              receipt.mode === 'shadow' &&
              receipt.request_id === requestId &&
              receipt.head_sha === expectedHead &&
              receipt.merge_sha === expectedMerge &&
              receipt.status === 'unavailable' &&
              bridge_reason_code !== null &&
              suppliedContextFailureValid &&
              (bridge_reason_code !== 'model_unavailable' || (
                bridge_failure_class !== null &&
                suppliedSignalsValid
