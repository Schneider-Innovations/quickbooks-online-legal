              ...receipt,
              result_kind: 'review_result',
              execution: { status: 'succeeded', retryable: false },
              review: { status: 'completed', decision: receipt.decision },
            } : {
              schema_version: '1.0',
              mode: 'shadow',
              request_id: requestId,
              head_sha: expectedHead,
              merge_sha: expectedMerge,
              status: 'unavailable',
              result_kind: 'execution_failure',
              reason_code: reason,
              execution: {
                status: 'failed',
                failure_class: bridge_failure_class || (
                  reason === 'policy_digest_not_allowed' ? 'policy' : 'receipt_protocol'
