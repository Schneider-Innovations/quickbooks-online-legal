              ...output,
              trusted_binding: {
                schema: 'ai-review-head-binding/v1',
                repository: `${context.repo.owner}/${context.repo.repo}`,
                pr_number: Number(process.env.PR_NUMBER),
                base_sha: expectedBase,
                head_sha: expectedHead,
                reviewed_merge_sha: expectedMerge,
                merge_tree_sha: expectedMergeTree,
                policy_digest: output.policy_digest || null,
                request_generation: process.env.REQUEST_GENERATION,
