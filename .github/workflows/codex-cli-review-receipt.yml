                retryable: executionRetryable,
              },
              review: { status: 'not_produced', decision: null },
              bridge_reason_code,
              bridge_failure_class,
              bridge_failure_signals,
              bridge_retry_after_seconds,
              context_failure: suppliedContextFailure,
