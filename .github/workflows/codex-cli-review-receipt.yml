                  failure_stage: receipt.failure.failure_stage,
                  actual_bytes: receipt.failure.actual_bytes,
                  limit_bytes: receipt.failure.limit_bytes,
                  unit: receipt.failure.failure_stage.endsWith('_lines') ? 'lines' : 'bytes',
