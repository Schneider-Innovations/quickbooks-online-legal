            // old single 660-second deadline started before the Agent claimed
            // the request, so a healthy request that waited behind another
            // model invocation could be terminalized while its own model was
            // still running. The Agent atomically moves a request out of the
            // submitter-visible incoming directory when work starts; observe
            // only that path transition and never read the claimed snapshot.
